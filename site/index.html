<!-- E7's .scsp is a custom container around LZ4-compressed Spine 3.8.99 (newer rigs)
     or 2.1.27 (older rigs) binary, with the texture as a separate .sct (also LZ4 +
     RGB565/ASTC). We bake static PNG poses ahead of time via tools/ and a deploy-
     friendly live viewer at viewer.html?slug=<id> uses spine-player on the same
     converted assets in assets/<id>/. Names + ceciliabot kebab slugs come from
     two community-maintained JSONs that build_index.py merges into units.json. -->
<style>
  :root{--ink:#0c0d12;--ink-2:#13141d;--panel:#171826;--line:#2a2c3f;
    --gold:#d8b06a;--gold-dim:#9a824e;--teal:#6fd6c4;--text:#e7e5dd;
    --mut:#8d8c9c;--rose:#d98aa0;
    --fire:#e07a5a;--ice:#7ac0d8;--wind:#86c97a;--light:#e8d27a;--dark:#b07ad8}
  /* Stepped page zoom for wide displays. Lightbox sits outside <main>
     so it stays at 1× — full-size assets open at native resolution.
     Stepped instead of clamp()/calc() because Firefox's `zoom` parser
     rejects dynamic values; Chromium accepts both. */
  @media (min-width:1700px){header,main{zoom:1.10}}
  @media (min-width:2000px){header,main{zoom:1.20}}
  @media (min-width:2300px){header,main{zoom:1.30}}
  @media (min-width:2800px){header,main{zoom:1.40}}
  @media (min-width:3300px){header,main{zoom:1.50}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 600px at 80% -10%,rgba(216,176,106,.08),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(111,214,196,.06),transparent 55%),var(--ink);color:var(--text);font-family:'Outfit',sans-serif;line-height:1.5;min-height:100vh}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold);color:var(--ink)}
  header{padding:34px 40px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:26px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(23,24,38,.6),transparent)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:.04em;color:var(--gold);font-weight:600;cursor:pointer;transition:.2s}
  .brand:hover{color:var(--text)}
  .brand small{display:block;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.32em;color:var(--mut);text-transform:uppercase;margin-top:2px}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:none;border:1px solid transparent;color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;cursor:pointer;border-radius:2px;transition:.2s;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px}
  nav button:hover{color:var(--text)}
  nav button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.06)}
  /* Small gold dot on Wallpapers nav — dismisses after first open, max ~2 weeks */
  nav button .nav-pastille{
    width:7px;height:7px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(145deg,#f3d79a,#e6b86e);
    box-shadow:0 0 0 1px rgba(13,14,22,.45),0 0 8px rgba(230,184,110,.45);
    animation:nav-pastille-blink 1.6s ease-in-out infinite;
  }
  @keyframes nav-pastille-blink{
    0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 1px rgba(13,14,22,.45),0 0 8px rgba(230,184,110,.45)}
    50%{opacity:.35;transform:scale(.88);box-shadow:0 0 0 1px rgba(13,14,22,.45),0 0 3px rgba(230,184,110,.2)}
  }
  @media (prefers-reduced-motion:reduce){
    nav button .nav-pastille{animation:none}
  }
  .lang-sel{background:rgba(255,255,255,.02);border:1px solid var(--gold-dim);color:var(--gold);font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.08em;padding:8px 10px;margin-left:6px;border-radius:2px;cursor:pointer;flex:0 0 auto;align-self:center}
  .lang-sel:hover{color:var(--text)}
  .lang-sel option{background:var(--ink,#14151d);color:var(--text)}
  @media(max-width:720px){
    header{padding:20px 16px 14px;gap:14px}
    nav{margin-left:0;width:100%;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;-ms-overflow-style:none}
    nav::-webkit-scrollbar{display:none}
  }
  main{max-width:1500px;margin:0 auto;padding:30px 40px 90px}
  .bar{display:flex;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
  .bar input{flex:1;min-width:220px;background:var(--ink-2);border:1px solid var(--line);color:var(--text);padding:11px 15px;border-radius:3px;font-family:'Spline Sans Mono',monospace;font-size:13px}
  .bar input:focus{outline:none;border-color:var(--gold-dim)}
  .q-wrap{flex:1;min-width:220px;position:relative;display:flex}
  .q-wrap input{min-width:0;padding-right:54px}
  .qmode{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:var(--ink);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.08em;padding:4px 9px;border-radius:2px;cursor:pointer}
  .qmode:hover{color:var(--text);border-color:var(--gold-dim)}
  .qmode.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.07)}
  .count{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--mut);letter-spacing:.1em}
  .sort-toggle{margin-left:auto;display:flex;align-items:center;gap:5px}
  .sort-toggle .sort-label{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
  .sort-toggle button{background:var(--ink-2);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.08em;padding:5px 11px;border-radius:2px;cursor:pointer}
  .sort-toggle button.on{color:var(--gold);border-color:var(--gold-dim)}
  .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
  .kinds button{background:var(--ink-2);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;padding:6px 13px;border-radius:2px;cursor:pointer;text-transform:uppercase}
  .kinds button.on{color:var(--gold);border-color:var(--gold-dim)}
  .kinds button .n{color:var(--mut);margin-left:6px;font-size:10px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:.22s;position:relative;display:block;color:inherit;text-decoration:none}
  .card:hover{border-color:var(--gold-dim);transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.9)}
  .thumb{aspect-ratio:3/4;background:linear-gradient(135deg,#1c1d2b,#101019);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
  .variant-badge{position:absolute;top:8px;right:8px;background:rgba(216,176,106,.18);color:var(--gold);font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:2px;border:1px solid var(--gold-dim);text-transform:uppercase}
  /* NEW badge — filled gold, top-left, so it pops against the dark card and
     doesn't collide with the gold-outline variant-badge at top-right. */
  .new-badge{position:absolute;top:8px;left:8px;z-index:3;background:linear-gradient(95deg,#e6b86e,#f3d79a);color:#13141d;font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 8px;border-radius:2px;text-transform:uppercase;box-shadow:0 2px 9px rgba(0,0,0,.45)}
  /* Wallpaper cells already carry a category chip at top-left — push NEW to the right. */
  .wallpaper-cell .new-badge{left:auto;right:6px;top:6px}
  /* Animated lobby cards: top-left of poster */
  .wp-anim-card .new-badge{top:6px;left:6px}
  /* Unit Illustration event wallpaper: Event badge is top-left → NEW top-right */
  .illust-card > .new-badge{left:auto;right:6px;top:6px}
  /* Emote rows aren't positioned cards — render NEW as an inline chip by the name. */
  .new-badge.inline{position:static;display:inline-block;margin-left:8px;vertical-align:middle;box-shadow:none}
  /* ANNOUNCED — official kit/preview out, gacha not open yet. Violet so it
     reads as "coming" rather than gold NEW (which activates after release). */
  .ann-badge{position:absolute;top:8px;left:8px;z-index:3;background:linear-gradient(95deg,#9b7ed9,#c4a8f0);color:#16121f;font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:2px;text-transform:uppercase;box-shadow:0 2px 9px rgba(0,0,0,.45)}
  .ann-badge.inline{position:static;display:inline-block;margin-left:8px;vertical-align:middle;box-shadow:none}
  .card.is-ann .upd-badge{top:34px}
  /* UPDATED badge — existing unit changed recently (e.g. new intimacy art). Cool
     teal to distinguish from the gold NEW badge; stacks below NEW when both. */
  .upd-badge{position:absolute;top:8px;left:8px;z-index:3;background:linear-gradient(95deg,#5cb6c9,#93d6e2);color:#0c1418;font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 8px;border-radius:2px;text-transform:uppercase;box-shadow:0 2px 9px rgba(0,0,0,.45)}
  .card.is-new .upd-badge{top:34px}
  .upd-badge.inline{position:static;display:inline-block;margin-left:8px;vertical-align:middle;box-shadow:none}
  /* UNRELEASED — LOCAL-ONLY held-back units (datamined-ahead heroes). Rose, to
     read as "hidden / not live", clearly apart from the gold NEW + teal UPDATED
     badges. Dashed rose card outline reinforces "this never ships". */
  .unrel-badge{position:absolute;top:8px;left:8px;z-index:4;background:linear-gradient(95deg,#d76e8f,#e29bb4);color:#1d1218;font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:2px;text-transform:uppercase;box-shadow:0 2px 9px rgba(0,0,0,.45)}
  .unrel-badge.inline{position:static;display:inline-block;margin-left:8px;vertical-align:middle;font-size:12px;box-shadow:none}
  .card.is-unrel,.artifact-cell.is-unrel{outline:1px dashed rgba(215,110,143,.6);outline-offset:-1px}
  .card.is-unrel .new-badge,.card.is-unrel .upd-badge{top:34px}
  .form-swap{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap;opacity:1;transition:opacity .18s;pointer-events:auto}
  /* Devices that support real hover get a clean thumb until the user
     hovers; touch devices keep the pills visible so they're discoverable. */
  @media (hover: hover){
    .form-swap{opacity:0;pointer-events:none}
    .card:hover .form-swap,.form-swap:focus-within{opacity:1;pointer-events:auto}
  }
  .form-swap button{background:rgba(13,14,22,.82);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;cursor:pointer;text-transform:uppercase;backdrop-filter:blur(2px)}
  .form-swap button:hover{color:var(--text);border-color:var(--gold-dim)}
  .form-swap button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.14)}
  .meta{padding:11px 13px}
  .meta .name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text);line-height:1.18;word-break:break-word}
  .meta .id{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.05em}
  .meta .sub{font-size:11px;color:var(--mut);margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-family:'Spline Sans Mono',monospace;font-size:10px;padding:1px 7px;border-radius:2px;letter-spacing:.04em}
  .tag.spine{color:var(--teal);border:1px solid rgba(111,214,196,.3)}
  .tag.art{color:var(--gold);border:1px solid rgba(216,176,106,.3)}
  .tag.skill{color:var(--rose);border:1px solid rgba(217,138,160,.3)}
  .tag.upd{color:var(--rose);border:1px solid rgba(217,138,160,.3)}
  .attr{font-family:'Spline Sans Mono',monospace;font-size:9px;padding:1px 6px;border-radius:9px;letter-spacing:.08em;text-transform:uppercase}
  .attr.fire{color:var(--fire);border:1px solid rgba(224,122,90,.35)}
  .attr.ice{color:var(--ice);border:1px solid rgba(122,192,216,.35)}
  .attr.wind{color:var(--wind);border:1px solid rgba(134,201,122,.35)}
  .attr.light{color:var(--light);border:1px solid rgba(232,210,122,.35)}
  .attr.dark{color:var(--dark);border:1px solid rgba(176,122,216,.35)}
  .cls{font-family:'Spline Sans Mono',monospace;font-size:9px;padding:1px 6px;border-radius:2px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);border:1px solid rgba(154,130,78,.35)}
  .stars{color:var(--gold);letter-spacing:-1px;font-size:11px}
  /* Two-level wrap. .filters itself wraps groups, so a narrow viewport
     breaks at a group boundary (element / class / rarity) before it
     wraps a chip mid-group. .fgroup is the inner flex container that
     holds each label + its chips and only wraps within if even the group
     can't fit on one line. */
  .filters{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin:-12px 0 24px}
  .filters .fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters .flabel{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-right:2px}
  .filters .chip{background:var(--ink-2);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;padding:5px 11px;border-radius:2px;cursor:pointer;text-transform:uppercase}
  .filters .chip:hover{color:var(--text);border-color:var(--gold-dim)}
  .filters .chip.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.07)}
  .filters .chip.el-fire.on{color:var(--fire);border-color:rgba(224,122,90,.55)}
  .filters .chip.el-ice.on{color:var(--ice);border-color:rgba(122,192,216,.55)}
  .filters .chip.el-wind.on{color:var(--wind);border-color:rgba(134,201,122,.55)}
  .filters .chip.el-light.on{color:var(--light);border-color:rgba(232,210,122,.55)}
  .filters .chip.el-dark.on{color:var(--dark);border-color:rgba(176,122,216,.55)}
  .filters .chip.rar{letter-spacing:-1px;font-size:13px;padding:3px 11px}
  .filters .chip.clear{color:var(--mut);font-size:10px}
  /* Updates page: two distinct views (event gallery vs pack diff) */
  .upd-intro{margin:0 0 16px}
  .upd-intro h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--gold);margin:0 0 6px;letter-spacing:.02em}
  .upd-intro p{margin:0;font-size:13px;line-height:1.5;color:var(--mut);max-width:62ch}
  .upd-subnav{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:0 0 22px;
    padding:0;
  }
  @media(max-width:560px){.upd-subnav{grid-template-columns:1fr}}
  .upd-subnav .usub{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    padding:14px 16px 14px 18px;
    text-decoration:none;
    color:var(--mut);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s, box-shadow .15s;
  }
  .upd-subnav .usub:hover{border-color:var(--gold-dim);color:var(--gold-dim)}
  .upd-subnav .usub.on{
    color:var(--text);
    border-color:var(--gold-dim);
    background:rgba(216,176,106,.1);
    box-shadow:inset 3px 0 0 var(--gold);
  }
  .upd-subnav .usub .usub-top{
    display:flex;align-items:baseline;gap:10px;width:100%;
    font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1.15;
  }
  .upd-subnav .usub.on .usub-top{color:var(--gold)}
  .upd-subnav .usub .n{
    margin-left:auto;
    font-family:'Spline Sans Mono',monospace;
    font-size:11px;letter-spacing:.06em;font-weight:400;
    color:var(--mut);
    background:rgba(0,0,0,.2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 9px;
  }
  .upd-subnav .usub.on .n{color:var(--gold-dim);border-color:rgba(216,176,106,.35)}
  .upd-subnav .usub .usub-desc{
    font-size:12px;line-height:1.45;color:var(--mut);letter-spacing:0;
    font-family:inherit;max-width:46ch;
  }
  .upd-subnav .usub.on .usub-desc{color:var(--text);opacity:.8}
  .upd-subnav .usub .usub-state{
    font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:transparent;margin-top:4px;height:1em;
  }
  .upd-subnav .usub.on .usub-state{color:var(--gold-dim)}
  .updates-list{display:grid;gap:32px}
  .upd-row{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .upd-head{display:flex;align-items:baseline;gap:18px;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .upd-head h3{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);font-weight:600}
  .upd-head .code{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
  .upd-head .count{margin-left:auto}
  /* Masonry / tetris pack: each image keeps its natural aspect ratio; columns
     stack them so leftover vertical gaps fill instead of equal-height crops
     or sparse CSS-grid rows. */
  .upd-media{
    column-count:4;
    column-gap:6px;
    padding:8px;
    background:rgba(0,0,0,.14);
    border-bottom:1px solid var(--line);
  }
  .upd-media a{
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    page-break-inside:avoid;
    display:block;
    width:100%;
    margin:0 0 6px;
    background:var(--ink-2);
    overflow:hidden;
    border:1px solid transparent;
    border-radius:3px;
    line-height:0;
  }
  .upd-media a:hover{border-color:var(--gold-dim)}
  .upd-media img{
    width:100%;
    height:auto;
    display:block;
    vertical-align:top;
  }
  .upd-media a:only-child{max-width:min(100%,720px);margin-left:auto;margin-right:auto}
  @media(max-width:1100px){.upd-media{column-count:3}}
  @media(max-width:720px){.upd-media{column-count:2}}
  @media(max-width:420px){.upd-media{column-count:1}}
  /* DB-enriched cast strip (substory_main heroes) + meta chips */
  .upd-cast-block{border-top:1px solid var(--line);background:rgba(0,0,0,.12);padding:12px 22px 14px}
  .upd-cast-block + .upd-cast-block{padding-top:8px}
  .upd-cast-block.bonus{background:rgba(0,0,0,.06)}
  .upd-cast-lbl{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold-dim);letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
  .upd-cast-block.bonus .upd-cast-lbl{color:var(--mut)}
  .upd-cast-lbl .n{color:var(--mut);margin-left:6px;letter-spacing:.06em}
  .upd-cast{display:flex;flex-wrap:wrap;gap:10px}
  .upd-cast a{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;text-decoration:none;color:inherit;transition:.15s;position:relative}
  .upd-cast a.is-arti{width:76px}
  .upd-cast a.is-arti .uc-pose{aspect-ratio:378/598;height:auto;min-height:72px;position:relative}

  .upd-cast .uc-pose{width:64px;height:72px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-2);display:flex;align-items:center;justify-content:center}
  .upd-cast a.is-arti .uc-pose{width:68px}

  .upd-cast .uc-pose img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .upd-cast .uc-pose.miss{font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--mut);padding:4px;text-align:center;word-break:break-all}
  .upd-cast .uc-name{font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--gold-dim);letter-spacing:.04em;text-align:center;line-height:1.2;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .upd-cast .uc-badge{position:absolute;top:-3px;right:2px;font-family:'Spline Sans Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;background:rgba(13,14,22,.9);border:1px solid var(--gold-dim);color:var(--gold);padding:1px 4px;border-radius:2px;line-height:1.2}
  /* CeciliaBot pill on Featured artifact thumbs (same idea as Artifacts tab). */

  .upd-cast a.is-arti .a-cb:hover{color:var(--gold);border-color:var(--gold-dim)}
  /* Unit detail — signature EE strip (same owner map as Updates Featured). */
  .sig-arti{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0 8px}
  .sig-arti a{display:flex;flex-direction:column;align-items:center;gap:6px;width:110px;text-decoration:none;color:inherit;position:relative;transition:.15s}
  .sig-arti a:hover{transform:translateY(-2px)}
  .sig-arti .sa-pose{width:100px;aspect-ratio:378/598;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-2);position:relative}
  .sig-arti a:hover .sa-pose{border-color:var(--gold-dim)}
  .sig-arti .sa-pose img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .sig-arti .sa-name{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold-dim);letter-spacing:.04em;text-align:center;line-height:1.25;max-width:110px}
  .sig-arti .sa-meta{display:block;font-size:9px;color:var(--mut);letter-spacing:.06em;margin-top:2px;text-transform:capitalize}
  .sig-arti .sa-badge{position:absolute;top:4px;left:4px;font-family:'Spline Sans Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;background:rgba(13,14,22,.9);border:1px solid var(--gold-dim);color:var(--gold);padding:2px 5px;border-radius:2px;z-index:2}
  .sig-arti .a-cb{position:absolute;bottom:6px;right:6px;background:rgba(13,14,22,.88);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);z-index:2;cursor:pointer}
  .sig-arti .a-cb:hover{color:var(--gold);border-color:var(--gold-dim)}
  /* Artifacts grid — owner unit pill (button, not nested <a> inside the cell). */
  .artifact-cell .a-owner{position:absolute;top:8px;right:8px;z-index:2;background:rgba(13,14,22,.88);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:9px;padding:3px 8px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .artifact-cell .a-owner:hover{color:var(--gold);border-color:var(--gold-dim)}
  .artifact-cell.is-ann .a-owner,.artifact-cell.is-new .a-owner{top:34px}
  .upd-meta{display:flex;flex-wrap:wrap;gap:8px;padding:10px 22px 14px;border-top:1px solid var(--line)}
  .upd-meta .chip{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:3px 8px;letter-spacing:.06em}
  .upd-meta .chip.db{color:var(--gold-dim);border-color:rgba(216,176,106,.35)}
  .upd-row.db-only{border-style:dashed;border-color:rgba(216,176,106,.28)}
  .upd-row.db-only .upd-head h3{opacity:.92}
  /* Cinema sits directly under the card head (first content block). */
  .upd-videos{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:rgba(0,0,0,.22);border-bottom:1px solid var(--line)}
  .upd-vid{flex:1 1 320px;max-width:100%;display:block;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000;cursor:pointer;transition:.15s;text-decoration:none;color:inherit}
  .upd-vid:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
  .upd-vid:only-child{flex-basis:min(100%,720px);max-width:720px}
  .upd-vid video{width:100%;aspect-ratio:16/9;display:block;object-fit:contain;background:#000;pointer-events:none}
  .upd-vid .uv-meta{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-top:1px solid var(--line)}
  .upd-vid .uv-play{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
  .upd-vid .uv-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .patches{display:grid;gap:20px;margin-bottom:36px}
  .patch{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .patch-head{display:flex;align-items:baseline;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .patch-head h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);font-weight:600}
  .patch-head .code{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
  .patch-head .count{margin-left:auto;color:var(--gold-dim)}
  .patch-note{margin:0 0 14px;font-size:12px;line-height:1.5;color:var(--mut);font-style:italic;max-width:70ch}
  .patch-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding:18px 22px}
  .patch-thumbs .pt{position:relative;display:block;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-decoration:none;transition:.18s}
  .patch-thumbs .pt:hover{border-color:var(--gold-dim)}
  .patch-thumbs .pt img{width:100%;height:130px;object-fit:contain;display:block;background:var(--ink-2)}
  .patch-thumbs .pt-name{display:block;font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:.04em;padding:4px 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt-badge{position:absolute;top:5px;left:5px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:12px;font-weight:700;line-height:1;color:var(--ink)}
  .pt-added{background:#7fc99a}.pt-update{background:#ffd84a}.pt-removed{background:var(--rose)}.pt-changed{background:var(--gold)}
  .patch-raw{border-top:1px solid var(--line)}
  .patch-raw summary{cursor:pointer;padding:12px 22px;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;user-select:none}
  .patch-raw summary:hover{color:var(--gold-dim)}
  .patch-group{padding:6px 22px 14px}
  .pg-label{display:block;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold-dim);letter-spacing:.14em;text-transform:uppercase;margin:10px 0 7px}
  .pg-label .pg-n{color:var(--mut);margin-left:4px}
  .pg-items{display:grid;gap:3px}
  /* Path-only rows (no thumbnail) — collapsed by default so the rollup stays scannable. */
  .pg-plain{margin-top:6px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.12)}
  .pg-plain > summary{cursor:pointer;list-style:none;padding:8px 10px;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.06em;user-select:none}
  .pg-plain > summary::-webkit-details-marker{display:none}
  .pg-plain > summary::before{content:"▸ ";color:var(--gold-dim)}
  .pg-plain[open] > summary::before{content:"▾ "}
  .pg-plain > summary:hover{color:var(--gold-dim)}
  .pg-plain .pg-items{padding:0 8px 8px}
  .pe{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--text);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .pe.has-prev{align-items:center}
  .pe code{font-size:11px;color:var(--mut)}
  .pe-sym{font-weight:700;width:11px;flex:0 0 auto;text-align:center}
  .pe-added .pe-sym{color:#7fc99a}.pe-update .pe-sym{color:#ffd84a}.pe-removed .pe-sym{color:var(--rose)}.pe-changed .pe-sym{color:var(--gold)}
  .pe-size{font-size:10px;color:var(--mut)}
  .pe-prev{flex:0 0 auto;display:block;width:46px;height:34px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--ink-2);order:-1}
  .pe-prev:hover{border-color:var(--gold-dim)}
  .pe-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .emote-list{display:grid;gap:14px}
  .emote-row{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:14px 18px;display:grid;grid-template-columns:minmax(160px,200px) 1fr;gap:18px;align-items:center}
  @media(max-width:640px){.emote-row{grid-template-columns:1fr;gap:10px}}
  .emote-row.link{cursor:pointer;transition:.2s}
  .emote-row.link:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .emote-who .who-name{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text);line-height:1.1}
  .emote-who .who-id{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.06em}
  .emote-who .who-count{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
  .emote-grid{display:flex;flex-wrap:wrap;gap:10px}
  .emote-cell{position:relative;width:78px;height:78px;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;transition:.15s}
  .emote-cell:hover{border-color:var(--gold-dim);transform:scale(1.04)}
  .emote-cell img{width:100%;height:100%;object-fit:contain;padding:4px}
  .emote-cell .theme{position:absolute;bottom:0;left:0;right:0;font-family:'Spline Sans Mono',monospace;font-size:8px;color:var(--mut);text-align:center;background:rgba(13,14,22,.78);padding:1px 2px;letter-spacing:.04em;text-transform:lowercase;line-height:1.2}
  .emote-cell.animated{border-color:rgba(216,176,106,.35)}
  .wallpaper-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .wallpaper-cell{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--ink-2);transition:.2s;cursor:pointer;aspect-ratio:16/9}
  .wallpaper-cell:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .wallpaper-cell img{width:100%;height:100%;display:block;object-fit:cover}
  .wallpaper-cell .wp-name{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(13,14,22,.92) 10%,transparent 90%);padding:14px 14px 8px;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
  .wallpaper-cell .wp-cat{position:absolute;top:6px;left:6px;background:rgba(13,14,22,.78);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:.1em;text-transform:uppercase}
  /* Animated lobby section — equal-height posters; unit links only in lightbox */
  .wp-anim-block{margin:0 0 8px}
  .wp-anim-block .section-label{margin-bottom:6px}
  .wp-anim-blurb{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--mut);line-height:1.45;max-width:62ch;margin:0 0 16px}
  .wp-anim-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .wp-anim-card{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--ink-2);aspect-ratio:16/9}
  .wp-anim-card:hover{border-color:var(--gold-dim)}
  .wp-anim-poster{position:absolute;inset:0;background:#000;cursor:pointer;border:0;padding:0;display:block;width:100%;height:100%}
  .wp-anim-poster img{width:100%;height:100%;display:block;object-fit:cover}
  .wp-anim-poster .wp-anim-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,14,.35);transition:.15s}
  .wp-anim-poster:hover .wp-anim-play{background:rgba(8,9,14,.5)}
  .wp-anim-poster .wp-anim-play span{font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(13,14,22,.88);border:1px solid var(--gold-dim);padding:8px 14px;border-radius:3px;white-space:nowrap}
  /* Idle / Story (etc.) — same pattern as unit cosmetic pose-switch */
  .wp-anim-variants{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;pointer-events:none}
  .wp-anim-variants button{pointer-events:auto;background:rgba(13,14,22,.88);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;padding:4px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase;backdrop-filter:blur(3px)}
  .wp-anim-variants button:hover{color:var(--text);border-color:var(--gold-dim)}
  .wp-anim-variants button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.12)}
  /* Unit illustration cards: tabs sit above the bottom title strip */
  .illust-card > .wp-anim-variants{left:6px;right:6px;bottom:28px}
  .artifact-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .artifact-cell{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--ink-2);transition:.2s;cursor:pointer;aspect-ratio:378/598;display:block}
  .artifact-cell:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .artifact-cell img{width:100%;height:100%;display:block;object-fit:cover;transition:.25s}
  .artifact-cell:hover img{transform:scale(1.03)}
  .artifact-cell .a-name{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(13,14,22,.96) 25%,rgba(13,14,22,.4) 75%,transparent 100%);padding:22px 11px 9px;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
  .artifact-cell .a-meta{display:block;font-size:9px;color:var(--mut);letter-spacing:.08em;margin-top:3px;text-transform:capitalize}
  .artifact-cell .a-cb{position:absolute;bottom:8px;right:8px;background:rgba(13,14,22,.82);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:9px;padding:3px 8px;border-radius:2px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);backdrop-filter:blur(2px);z-index:2;opacity:1;transition:opacity .18s,color .18s,border-color .18s;white-space:nowrap;cursor:pointer}
  .artifact-cell .a-cb:hover{color:var(--gold);border-color:var(--gold-dim)}
  /* Touch devices keep the pill visible (no hover); hover-capable devices
     hide it until the card is hovered. Mirrors .form-swap on unit cards. */
  @media (hover: hover){
    .artifact-cell .a-cb{opacity:0;pointer-events:none}
    .artifact-cell:hover .a-cb,.artifact-cell .a-cb:focus{opacity:1;pointer-events:auto}
  }
  .detail{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:40px}
  .detail>.art-sec{grid-column:1/-1}
  @media(max-width:880px){.detail{grid-template-columns:1fr}}
  .stage{background:var(--ink-2);border:1px solid var(--line);border-radius:5px;min-height:560px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .stage img{max-width:100%;max-height:78vh;display:block;object-fit:contain}
  .nopose{color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.08em;text-align:center;padding:30px;line-height:1.7}
  .nopose code{background:rgba(216,176,106,.08);color:var(--gold);padding:1px 5px;border-radius:2px}
  .dt-head h2{font-family:'Cormorant Garamond',serif;font-size:46px;color:var(--text);font-weight:600;line-height:1.05;word-break:break-word}
  .dt-head .ids{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--mut);margin:6px 0 8px;letter-spacing:.08em}
  .dt-head .meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
  .variant-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .variant-tabs button{background:none;border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;padding:7px 12px;border-radius:2px;cursor:pointer;text-transform:uppercase;transition:.2s}
  .variant-tabs button:hover{color:var(--text)}
  .variant-tabs button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.06)}
  .variant-tabs .tl{font-size:9px;color:var(--mut);display:block;letter-spacing:.18em;margin-top:1px}
  .pose-switch{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
  .pose-switch .ps-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-right:3px}
  .pose-switch button{background:var(--ink-2);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;padding:3px 9px;border-radius:2px;cursor:pointer;text-transform:uppercase}
  .pose-switch button:hover{color:var(--text);border-color:var(--gold-dim)}
  .pose-switch button.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(216,176,106,.07)}
  .extbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .ext{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--gold-dim);color:var(--gold);padding:8px 15px;border-radius:3px;font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.08em;transition:.2s;cursor:pointer}
  .ext:hover{background:rgba(216,176,106,.08)}
  .ext.flat{border-color:var(--line);color:var(--mut);cursor:default}
  .ext.flat:hover{background:transparent}
  /* Match <a class="ext"> — only strip UA button chrome. Do NOT set font:* here
     (even font:inherit): .ext.as-btn is more specific than .ext and would undo
     Spline Sans Mono / letter-spacing from the shared pill style. */
  button.ext{-webkit-appearance:none;appearance:none;background:transparent;margin:0}
  /* Profile frame compositor (TASKS #32)
     Default: fixed panel, two regions — preview (optional scroll) + frame grid scroll.
     Only very short viewports fall back to whole-panel scroll. */
  .frame-modal{position:fixed;inset:0;z-index:90;background:rgba(8,9,14,.82);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);overscroll-behavior:contain}
  .frame-modal.open{display:flex}
  .frame-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:min(960px,100%);max-height:min(92vh,900px);height:min(92vh,900px);display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.85)}
  .frame-head{display:flex;align-items:baseline;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto;background:var(--panel)}
  .frame-head h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);font-weight:600;letter-spacing:.03em}

  .frame-close{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mut);width:34px;height:34px;border-radius:3px;cursor:pointer;font-size:18px;line-height:1}
  .frame-close:hover{color:var(--text);border-color:var(--gold-dim)}
  .frame-body{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:0;min-height:0;flex:1 1 auto;overflow:hidden}
  /* Region 1 — preview column (scrolls only if face picker overflows) */
  .frame-preview-col{padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;background:transparent;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  /* Fixed preview box — every frame is 148×148 (official + UI). No jump when switching. */
  .frame-canvas-wrap{width:168px;height:168px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);border-radius:4px;image-rendering:auto}
  .frame-canvas-wrap canvas{width:148px;height:148px;display:block;background:transparent}
  .frame-dl{width:100%;flex:0 0 auto;background:rgba(216,176,106,.12);border:1px solid var(--gold-dim);color:var(--gold);font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.1em;padding:10px 12px;border-radius:3px;cursor:pointer;text-transform:uppercase}

  .frame-faces-row button{background:var(--ink-2);border:1px solid var(--line);padding:0;border-radius:3px;cursor:pointer;width:44px;height:44px;overflow:hidden}
  .frame-faces-row button img{width:100%;height:100%;object-fit:cover;display:block}
  .frame-faces-row button.on{border-color:var(--gold-dim);box-shadow:0 0 0 1px var(--gold-dim)}
  /* Region 2 — tools/cats fixed; grid is the main scroll region */
  .frame-pick-col{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
  .frame-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:0 0 auto}
  .frame-tools input{flex:1;min-width:140px;background:var(--ink-2);border:1px solid var(--line);color:var(--text);padding:8px 11px;border-radius:3px;font-family:'Spline Sans Mono',monospace;font-size:12px}
  .frame-tools input:focus{outline:none;border-color:var(--gold-dim)}
  .frame-cats{display:flex;flex-wrap:wrap;gap:5px;flex:0 0 auto}
  .frame-cats button{background:var(--ink-2);border:1px solid var(--line);color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:2px;cursor:pointer;text-transform:uppercase}
  .frame-cats button.on{color:var(--gold);border-color:var(--gold-dim)}
  .frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;overflow-x:hidden;overflow-y:auto;min-height:0;flex:1 1 auto;padding:2px 14px 8px 2px;align-content:start;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
  .frame-cell{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;-webkit-tap-highlight-color:transparent}
  .frame-cell:hover{border-color:var(--gold-dim)}
  .frame-cell.on{border-color:var(--gold);background:rgba(216,176,106,.08)}
  /* Stack face under border. Transparent bg — cell's ink-2 shows through PNG alpha.
     Face inset set in JS (112/148 ≈ 76% for all). UI faces get border-radius. */
  .frame-thumb{position:relative;width:64px;height:64px;flex:0 0 64px;background:transparent;border-radius:3px;overflow:hidden}
  .frame-thumb .ft-face{position:absolute;object-fit:contain;display:block;pointer-events:none}
  .frame-thumb .ft-face.ft-ui{border-radius:50%} /* UI rings are thin; square corners bleed */
  .frame-thumb .ft-border{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .frame-cell .fn{font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--mut);text-align:center;line-height:1.2;width:100%;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
  .frame-cell.none-cell{justify-content:center;min-height:96px;color:var(--mut);font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .frame-cell.none-cell .frame-thumb{/* same absolute face layout as other cells */}
  /* Narrow phones: stack columns, but still pin list height so only the grid scrolls */
  @media(max-width:720px){
    .frame-modal{padding:8px;align-items:stretch}
    .frame-panel{width:100%;max-height:100%;height:100%;border-radius:4px}
    .frame-head{padding:12px 14px 10px}
    .frame-head h3{font-size:20px}
    .frame-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .frame-preview-col{border-right:none;border-bottom:1px solid var(--line);padding:12px 14px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 14px;overflow:visible;flex:0 0 auto}
    .frame-canvas-wrap{width:120px;height:120px}
    .frame-canvas-wrap canvas{width:104px;height:104px}
    .frame-dl{width:auto;flex:1 1 140px;min-width:120px;padding:10px 12px}
    .frame-faces{width:100%}
    .frame-pick-col{padding:10px 12px 12px;min-height:0}
    .frame-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:2px 10px 12px 2px}
    .frame-thumb{width:56px;height:56px;flex-basis:56px}
  }
  /* Very short viewports (landscape phones, split-screen): whole panel scrolls —
     nested list regions are too tight to use. */
  @media(max-height:520px){
    .frame-panel{height:auto;max-height:min(96vh,100%);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
    .frame-head{position:sticky;top:0;z-index:2}
    .frame-body{flex:0 0 auto;overflow:visible;grid-template-rows:none}
    .frame-preview-col{overflow:visible}
    .frame-pick-col{overflow:visible}
    .frame-grid{overflow:visible;flex:none;max-height:none}
  }
  /* Official kit preview — small YouTube embed (ANNOUNCED units), not a bare button. */
  .ann-preview{margin:0 0 22px;max-width:min(360px,100%)}
  .ann-preview .section-label{margin-top:0;margin-bottom:10px}
  .ann-embed{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000}
  .ann-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .ann-yt-link{display:inline-block;margin-top:6px;font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--mut);text-decoration:none}
  .ann-yt-link:hover{color:var(--gold)}
  .gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .gallery a{display:block;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--ink-2)}
  .gallery a:hover{border-color:var(--gold-dim)}
  .gallery img{width:100%;display:block}
  .skill-gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .skill-gallery a{display:block;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#000;position:relative}
  .skill-gallery a:hover{border-color:var(--gold-dim)}
  .skill-gallery img{width:100%;display:block}
  /*
   * Skill anim + signature artifact.
   * When both exist (wide enough): artifact LEFT, skill RIGHT — same media
   * height, tight gap (not stretched across the full detail column).
   */
  .skill-sig-row{display:flex;flex-direction:column;gap:14px;margin:0 0 8px}
  .skill-sig-row .skill-col,.skill-sig-row .sig-col{min-width:0}
  /* Both headers share one baseline; the row itself owns the section top rule. */
  .skill-sig-row .skill-col .section-label,
  .skill-sig-row .sig-col .section-label{
    margin:0 0 10px;padding-top:0;border-top:none;
  }
  /* Section separator — same top rule as a normal .section-label. */
  .skill-sig-row.has-both{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  @media (min-width:640px){
    .skill-sig-row.has-both{
      flex-direction:row;
      flex-wrap:wrap;
      align-items:flex-start;
      /* Side-by-side gap between signature art and skill anim. */
      gap:12px 36px;
    }
    /* Shared media height so portrait + landscape read as one row. */
    .skill-sig-row.has-both{
      --ss-h: clamp(168px, 22vw, 220px);
    }
    .skill-sig-row.has-both .sig-col,
    .skill-sig-row.has-both .skill-col{
      display:flex;flex-direction:column;
    }
    .skill-sig-row.has-both .sig-col{
      flex:0 0 auto;
    }
    .skill-sig-row.has-both .skill-col{
      flex:0 1 auto; /* shrink-wrap — do NOT grow and leave a huge gap */
      min-width:0;
    }
    /* Label row is fixed height so multi-line titles still keep media aligned. */
    .skill-sig-row.has-both .sig-col > .section-label,
    .skill-sig-row.has-both .skill-col > .section-label{
      min-height:1.4em;
      line-height:1.4;
      margin:0 0 10px;
    }
    .skill-sig-row.has-both .sig-arti{
      display:flex;flex-wrap:wrap;gap:10px;margin:0;
    }
    .skill-sig-row.has-both .sig-arti a{
      width:auto;align-items:center;
    }
    .skill-sig-row.has-both .sig-arti .sa-pose{
      width:auto;
      height:var(--ss-h);
      aspect-ratio:378/598;
      min-height:0;
    }
    .skill-sig-row.has-both .sig-arti .sa-pose img{
      width:100%;height:100%;object-fit:cover;object-position:top center;
    }
    .skill-sig-row.has-both .sig-arti .sa-name{
      max-width:calc(var(--ss-h) * 378 / 598);
    }
    /* Skills sit in a tight flex row at the same height as the artifact. */
    .skill-sig-row.has-both .skill-gallery{
      display:flex;flex-wrap:wrap;gap:10px;
      grid-template-columns:unset;
    }
    .skill-sig-row.has-both .skill-gallery a{
      height:var(--ss-h);
      width:auto;
      max-width:min(420px, 55vw);
    }
    .skill-sig-row.has-both .skill-gallery img{
      width:auto;height:100%;max-width:100%;
      object-fit:contain;object-position:center;
      display:block;
    }
  }

  /* Lightbox modal — intercepts clicks on a[data-zoom] anywhere on the page

  .lightbox{

<script>
"use strict";
const KIND_LABELS = { unit:"Heroes", npc:"NPCs", monster:"Monsters",

// Human-readable label for a variant suffix on the slug.
const VARIANT_LABELS = {
  "":      { tab:"Base",     tagline:"" },
  "s01":   { tab:"S1 Skin",  tagline:"skin variant" },
  "s02":   { tab:"S2 Skin",  tagline:"skin variant" },
  "s01_1": { tab:"S1 alt",   tagline:"skin alt" },
  "s02_1": { tab:"S2 alt",   tagline:"skin alt" },
  "m":     { tab:"ML",       tagline:"moonlight form" },
  "m2":    { tab:"ML 2",     tagline:"second moonlight form" },
  "m_s01": { tab:"ML S1",    tagline:"moonlight skin" },
  "a01":   { tab:"Alt",      tagline:"alt form" },
  "t":     { tab:"Transform",tagline:"transformation form" },
  "1":     { tab:"Alt 1",    tagline:"alt model" },
};

let UNITS = [], UPDATES = {}, EMOTES = [], WALLPAPERS = [], LOBBY_ANIMS = [], ARTIFACTS = [], PATCHES = [], VOICES = {}, VOICE_CLIPS = {}, BY_BASE = new Map(), demo = false;
// Story book (LOCAL ONLY — story_index.json is gitignored + held aside on deploy,
// so this stays null in production and the Story tab never appears).
let STORY_INDEX = null, storyLang = "en", STORY_CHAPTERS = {};
// Per-line story voice: {clipKey: [langs]} (voices_story.json, local only).
// Text language (storyLang) and voice language (storyVoiceLang) are independent.
let VOICE_STORY = {}, storyAudio = null, THEATER = null, STORY_FRAMES = [];
let storyVoiceLang = "ja";   // story voice: en/ja/ko (default original JA)
// Voice-clip OGGs: local (same-origin site/voice/) when developing, else the
// R2 CDN. Host detection lives in shared.js (same logic the viewer uses).
const VOICE_BASE = E7.voiceBase;
let kindF = "all", searchQ = "", currentVariant = "", wpCatF = "all";
// Hub sort mode: "timeline" (default — by release date, newest first) or "az"
// (alphabetical by hero name). Persisted per browser; release dates come from
// units.json `released` (baked from timeline/timeline.json by build_index.py).
let sortMode = "timeline";
try { const s = localStorage.getItem("hub_sort"); if (s === "timeline" || s === "az") sortMode = s; } catch (_) {}
// Skill-3 full-clip feature (TASKS #57) is WIP — kept LOCAL-ONLY by host gate:
// the ▶ FULL S3 button renders only on localhost (E7.isLocal) or with ?s3=1,
// never on production e7codex.com. Lets the committed code ship dormant, so no
// index.html swap is needed at deploy time. Open the gate when the feature ships.
const S3_DEV = E7.isLocal || /[?&]s3=1/.test(location.search);
let artiRarityF = new Set(), artiRoleF = new Set(), artiSearchQ = "";
let elementF = new Set(), rarityF = new Set(), roleF = new Set();
// Units carry the canonical-id role values from HeroDatabase ("assassin",
// "manauser") — alias them to the user-facing names ceciliabot displays
// elsewhere on the site (thief, soul-weaver) so filters and badges read
// consistently across pages.
const UNIT_ROLE_ALIAS = { assassin: "thief", manauser: "soul-weaver" };
const ROLES = ["warrior", "knight", "ranger", "mage", "soul-weaver", "thief"];
const roleOf = (u) => UNIT_ROLE_ALIAS[u.role] || u.role || "";
// Badge text: hyphen replaced with space so CSS uppercase renders "SOUL WEAVER"
// instead of "SOUL-WEAVER". Filter chips use the same display rule.
const roleLabel = (r) => (r || "").replace("-", " ");
// Hub search keyboard mode. Android Firefox (and iOS) auto-flips the on-screen
// keyboard back to ABC after a digit on the symbol pane; inputmode + autocapitalize
// attributes don't override it. The ABC/123 toggle locks the numeric pad on
// when the user is searching by ID.
let qMode = "text";
const ELEMENTS = ["fire", "ice", "wind", "light", "dark"];
const RARITIES = [5, 4, 3];

// Fetch + parse one data JSON; resolve `fallback` on any failure.
const dataJson = (url, fallback) =>
  fetch(url, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(url); return r.json(); })
    .catch(() => fallback);

// voices.json (~680 KB) + voices_audio.json (~720 KB) feed only the detail
// page's voice section — don't make every hub visit pay for them at boot.
// detail() kicks this off on first use and re-renders once it resolves.
let _voicesPromise = null, _voicesLoaded = false;
function ensureVoices() {
  if (!_voicesPromise) {
    _voicesPromise = Promise.all([
      dataJson("data/voices.json", {}),
      dataJson("data/voices_audio.json", {}),
    ]).then(([v, c]) => { VOICES = v; VOICE_CLIPS = c; _voicesLoaded = true; });
  }
  return _voicesPromise;
}

async function load() {
  // Mid-load keystroke capture: if the boot hash is the hub (or empty), mount
  // the search bar immediately so typing during the units.json fetch is kept
  // in searchQ and applied on the first real hub() render.
  const bootHash = (location.hash || "").replace(/^#\/?/, "");
  if (!bootHash || bootHash === "hub" || bootHash.startsWith("?")) {
    showHubLoadingShell();
  }
  try {
    // units.json gates everything; the rest load in parallel alongside it and
    // degrade independently to empty fallbacks. cache:"no-cache" (NOT
    // no-store) — the browser revalidates against the server (ETag → 304)
    // instead of re-downloading the full body on every visit, while a fresh
    // deploy still propagates immediately.
    [UNITS, UPDATES, EMOTES, WALLPAPERS, LOBBY_ANIMS, ARTIFACTS, PATCHES, STORY_INDEX, VOICE_STORY] =
      await Promise.all([
        fetch("data/units.json", { cache: "no-cache" })
          .then(r => { if (!r.ok) throw new Error("units.json missing"); return r.json(); }),
        dataJson("data/updates.json", {}),
        dataJson("data/emotes.json", []),
        dataJson("data/wallpapers.json", []),
        dataJson("data/lobby_anims.json", []),
        dataJson("data/artifacts.json", []),
        dataJson("data/patches.json", []),
        dataJson("data/story_index.json", null),
        dataJson("data/voices_story.json", {}),
      ]);
  } catch (e) {
    // Local dev (file:// / localhost) without built data → seed demo content
    // so the layout is previewable. In production a failed units.json is a
    // network blip — show a retry state, never fake data.
    if (!E7.isLocal) {
      $("#app").innerHTML = `<p class="empty">${E7.t('err_load')}<br><br>
        <button class="ext" id="retryLoad" style="background:none">${E7.t('btn_retry')}</button></p>`;
      document.getElementById("retryLoad").onclick = () => {
        $("#app").innerHTML = `<p class="empty">${E7.t('loading')}</p>`;
        load();
      };
      return;
    }
    demo = true;
    UNITS = [
      { id:"c1019_s01", base_id:"c1019", variant:"s01", kind:"unit", name:"Ravi", slug:"ravi",
        pose:"assets/c1019_s01/pose.png", artworks:[], skills:[], spine:[{version:"3.8.99"}],
        updates:[], cecilia:"https://ceciliabot.github.io/#/hero/ravi" },
    ];
    UPDATES = {};
  }
  // LOCAL-ONLY: fold in held-back/unreleased units so hidden content is
  // browsable on localhost. units_unreleased.json is never deployed (deploy.ps1
  // holds it aside), but we ALSO gate on E7.isLocal so a stray prod copy can't
  // surface. ?unreleased=1 forces it on (e.g. LAN preview), ?unreleased=0 off.
  const showUnrel = /[?&]unreleased=1/.test(location.search) ||
                    (E7.isLocal && !/[?&]unreleased=0/.test(location.search));
  if (showUnrel && !demo) {
    const unrel = await dataJson("data/units_unreleased.json", []);
    if (Array.isArray(unrel) && unrel.length) {
      for (const u of unrel) u.unreleased = true;
      UNITS = UNITS.concat(unrel);
    }
    // Same treatment for held-back artifacts (artifacts_unreleased.json).
    const unrelArti = await dataJson("data/artifacts_unreleased.json", []);
    if (Array.isArray(unrelArti) && unrelArti.length) {
      for (const a of unrelArti) a.unreleased = true;
      ARTIFACTS = unrelArti.concat(ARTIFACTS);   // pin held art to the top
    }
  }
  BY_BASE.clear();
  for (const u of UNITS) {
    const b = u.base_id || u.id;
    if (!BY_BASE.has(b)) BY_BASE.set(b, []);
    BY_BASE.get(b).push(u);
  }
  if (STORY_INDEX && (STORY_INDEX.episodes || []).length) injectStoryNav();
  // Load the language overlay BEFORE the first render so it's already localized
  // (English resolves instantly with no fetch; a fetch failure falls back to en).
  await E7.loadLang(E7.getLang());
  applyStaticChrome();
  route();
}

// Update chrome that lives OUTSIDE #app (route() never rewrites it): the nav tab
// labels + the language <select> value. Called at boot and after a lang switch.
function applyStaticChrome() {
  E7.applyI18n(document);   // sweep all [data-i18n] / [data-i18n-attr] chrome
  const ls = document.getElementById("langSel");
  if (ls) ls.value = E7.lang.get();
  updateWallpapersNavBadge();
}

/** Card/sub-tab NEW chips — separate from the nav pastille. */
function lobbyAnimsHasNew() {
  return (LOBBY_ANIMS || []).some((a) => a.new);
}
/** Newest `new_since` among flagged wallpapers / lobby packs (ISO date wave id). */
function wallpapersNavWaveId() {
  let best = "";
  for (const w of WALLPAPERS || []) {
    if (w.new && w.new_since && w.new_since > best) best = w.new_since;
  }
  for (const a of LOBBY_ANIMS || []) {
    if (a.new && a.new_since && a.new_since > best) best = a.new_since;
  }
  return best;
}
const WP_NAV_PASTILLE_DAYS = 14;
const WP_NAV_SEEN_KEY = "e7_wp_nav_seen";
/** Dot on Wallpapers nav: only while a wave is ≤2 weeks old and not yet opened. */
function wallpapersNavPastilleActive() {
  const wave = wallpapersNavWaveId();
  if (!wave) return false;
  const t0 = Date.parse(wave + "T00:00:00");
  if (Number.isNaN(t0)) return false;
  if (Date.now() - t0 > WP_NAV_PASTILLE_DAYS * 864e5) return false;
  try {
    if (localStorage.getItem(WP_NAV_SEEN_KEY) === wave) return false;
  } catch (_) {}
  return true;
}
function markWallpapersNavSeen() {
  const wave = wallpapersNavWaveId();
  if (!wave) return;
  try { localStorage.setItem(WP_NAV_SEEN_KEY, wave); } catch (_) {}
  updateWallpapersNavBadge();
}
/**
 * Gold dot on Wallpapers nav (not the full NEW chip).
 * Label stays in a child [data-i18n] span so applyI18n does not wipe the pastille.
 */
function updateWallpapersNavBadge() {
  const btn = document.querySelector('nav button[data-v="wallpapers"]');
  if (!btn) return;
  let pill = btn.querySelector(":scope > .nav-pastille");
  if (!wallpapersNavPastilleActive()) {
    if (pill) pill.remove();
    return;
  }
  if (!pill) {
    pill = document.createElement("span");
    pill.className = "nav-pastille";
    pill.setAttribute("aria-hidden", "true");
    btn.appendChild(pill);
  }
}

const $ = (s) => document.querySelector(s);
const setNav = (v) => document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));

// Pick the canonical entry for a base_id (prefer variant="" else lexicographically first).
function representative(base) {
  const variants = BY_BASE.get(base) || [];
  return variants.find(v => !v.variant) || variants[0];
}

// Build a display name. For variants we prefix with hero_name when it differs from name.
function displayName(u) {
  if (!u) return "";
  const name = E7.gameName(u), hero = E7.gameName(u, "hero_name");
  if (name && hero && name !== hero) return `${hero} — ${name}`;
  return name || u.id;
}

function variantTab(suf) {
  return (VARIANT_LABELS[suf] || { tab: suf.toUpperCase() }).tab;
}

function attrPill(u) {
  if (!u.attribute) return "";
  return `<span class="attr ${u.attribute}">${escapeHtml(E7.gameTerm("element", u.attribute))}</span>`;
}
function rolePill(u) {
  if (!u.role) return "";
  return `<span class="cls">${escapeHtml(E7.gameTerm("class", u.role))}</span>`;
}
function rarityStars(u) {
  if (!u.rarity) return "";
  return `<span class="stars" title="${u.rarity}★">${"★".repeat(u.rarity)}</span>`;
}

// Hub uses a tighter, FX-stripped thumb.png when available (Task #8) and
// falls back to pose.png when render_thumbs.js skipped the slug (no FX
// slots to strip). The detail page always uses pose.png regardless.
// Hub thumbnail source chain: thumb → pose → face. Each candidate is
// {url, trim?}. The first entry is loaded; remaining entries are JSON-encoded
// onto data-fallbacks and walked by hubFallback() on img.onerror. This
// survives a stale-cache scenario where units.json still references a
// thumb.png that has since been removed: the chain rolls forward to pose
// instead of jumping straight to the face artwork.
function hubCandidates(u) {
  const out = [];
  // thumb.png is baked tight at render time (smart-crop in render_thumbs.js),
  // so no trim sidecar is needed for it. pose.png still uses pose_trim.
  if (u.thumb) out.push({ url: u.thumb, trim: null });
  if (u.pose)  out.push({ url: u.pose,  trim: u.pose_trim  || null });
  if (!u.thumb && !u.pose) out.push({ url: `assets/${u.id}/pose.png`, trim: null });
  if (u.artworks && u.artworks[0]) out.push({ url: u.artworks[0], trim: null });
  return out;
}

function hubFallback(img) {
  let queue;
  try { queue = JSON.parse(img.dataset.fallbacks || "[]"); } catch { queue = []; }
  if (!queue.length) {
    img.onerror = null;
    img.style.display = "none";
    return;
  }
  const next = queue.shift();
  img.dataset.fallbacks = JSON.stringify(queue);
  if (next.trim) img.dataset.trim = JSON.stringify(next.trim);
  else delete img.dataset.trim;
  // Wipe positioning applyTrimCrop left on the prior source so the next
  // onload recomputes crop from scratch (or no-op if the new src has no trim).
  img.removeAttribute("style");
  img.src = next.url;
}

function thumb(u, group) {
  const cands = hubCandidates(u);
  const head  = cands.shift() || { url: "", trim: null };
  const tail  = cands;
  // Form-swap pills: visual-only preview of sibling variants. Click handlers
  // (wired in hub()) swap the <img> src in place and stopPropagation so the
  // card-level navigation isn't triggered. Each pill carries the variant's
  // full thumb→pose→face chain so a stale thumb URL doesn't degrade to face.
  const swap = (group && group.length > 1) ? `<div class="form-swap">${group.map((v, i) => {
    const vc  = hubCandidates(v);
    const vh  = vc.shift() || { url: "", trim: null };
    const lab = variantTab(v.variant || "");
    return `<button type="button" data-fs-src="${escapeHtml(vh.url)}" data-fs-fallbacks="${escapeHtml(JSON.stringify(vc))}" data-fs-variant="${escapeHtml(v.variant || "")}"${vh.trim ? ` data-fs-trim="${escapeHtml(JSON.stringify(vh.trim))}"` : ''}${i===0?' class="on"':''} title="preview ${escapeHtml(lab)}">${escapeHtml(lab)}</button>`;
  }).join("")}</div>` : "";
  // src is held in data-src and lifted onto the element only when the card is
  // near the viewport (hubImgObserver below). On scroll-away before load, the
  // src attribute is removed, which aborts the in-flight network request.
  return `<div class="thumb">
    <img data-src="${escapeHtml(head.url)}" data-fallbacks="${escapeHtml(JSON.stringify(tail))}" onerror="hubFallback(this)"${head.trim ? ` data-trim="${escapeHtml(JSON.stringify(head.trim))}"` : ''} onload="this.dataset.loaded='1';applyTrimCrop(this)">
    ${swap}
  </div>`;
}

// applyTrimCrop — called from hub card <img onload> and after hub() re-renders.
// Reads pre-baked trim fractions from data-trim (build_index.py copies them
// out of the per-slug pose_trim.json sidecars; the tool that originally baked
// those sidecars has been retired — slugs without one simply render with the
// image's natural framing). No canvas scan — zero GPU/CPU cost.
// Units without a data-trim attribute (character fills the full frame) are skipped.
function applyTrimCrop(img) {
  const raw = img.dataset.trim;
  if (!raw) return;
  const trim = JSON.parse(raw);
  const { l, t, fw, fh } = trim;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return;
  const wrap = img.parentElement;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  if (!cw || !ch) return;
  const scale   = Math.min(cw / (fw * iw), ch / (fh * ih));
  const imgLeft = (cw - fw * iw * scale) / 2 - l * iw * scale;
  const imgTop  = (ch - fh * ih * scale) / 2 - t * ih * scale;
  img.style.cssText = `position:absolute;padding:0;max-width:none;` +
    `width:${(iw * scale).toFixed(1)}px;height:${(ih * scale).toFixed(1)}px;` +
    `left:${imgLeft.toFixed(1)}px;top:${imgTop.toFixed(1)}px`;
}

// Hub image lazy-loader (Task #13). Native loading="lazy" queues every <img>
// in document order with no abort path, so a fast scroll past ~800 cards keeps
// the network busy fetching what the user already scrolled past — and that
// stalls the cards they're actually looking at on mobile. With IntersectionObserver
// we set src only when a card enters the rootMargin band, and removeAttribute('src')
// on exit aborts the in-flight request. Recreated per hub() render so detached
// nodes don't accumulate.
let _hubImgObs = null;
function observeHubImages() {
  if (_hubImgObs) _hubImgObs.disconnect();
  _hubImgObs = new IntersectionObserver((entries) => {
    for (const ent of entries) {
      const img = ent.target;
      if (ent.isIntersecting) {
        const want = img.dataset.src;
        if (want && !img.dataset.loaded && img.getAttribute("src") !== want) {
          img.setAttribute("src", want);
        }
      } else if (!img.dataset.loaded) {
        img.removeAttribute("src");
      }
    }
  }, { rootMargin: "400px 0px", threshold: 0 });
  document.querySelectorAll(".grid .thumb img[data-src]").forEach(img => _hubImgObs.observe(img));
}

// Shared with viewer.html — single implementation in shared.js. Kept as a
// local alias so the many call sites read the same.
const escapeHtml = E7.escapeHtml;

/** Extract a YouTube video id from watch / youtu.be / embed URLs. */
function youtubeId(url) {
  if (!url || typeof url !== "string") return null;
  try {
    const u = new URL(url.trim());
    const host = (u.hostname || "").replace(/^www\./, "").toLowerCase();
    if (host === "youtu.be") {
      const id = u.pathname.replace(/^\//, "").split("/")[0];
      return id || null;
    }
    if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
      const v = u.searchParams.get("v");
      if (v) return v;
      const m = u.pathname.match(/\/(?:embed|shorts|live)\/([^/?#]+)/);
      if (m) return m[1];
    }
  } catch (_) {}
  return null;
}

/** Filter + sort hub groups for the current search/filter/sort state. */
function hubFilteredList() {
  // Prefer the live input value so a soft re-render never races a pending key.
  const live = document.getElementById("q");
  if (live && document.activeElement === live) searchQ = live.value;
  const q = searchQ.toLowerCase().trim();

  // Build groups: one entry per base_id. The group's "kind" is its representative's kind.
  const groups = Array.from(BY_BASE.values())
    .map(g => g.slice().sort((a,b) => (a.variant||"").localeCompare(b.variant||"")));
  const kindCounts = {};
  groups.forEach(g => { const k = g[0].kind; kindCounts[k] = (kindCounts[k]||0)+1; });
  const kinds = ["all", ...Object.keys(kindCounts).sort((a,b)=>kindCounts[b]-kindCounts[a])];

  const list = groups.filter(g => {
    if (kindF !== "all" && g[0].kind !== kindF) return false;
    // Element/rarity: OR within a category (any selected matches), AND across
    // categories. A group passes if at least one of its variants matches.
    if (elementF.size && !g.some(u => u.attribute && elementF.has(u.attribute))) return false;
    if (rarityF.size  && !g.some(u => u.rarity    && rarityF.has(u.rarity)))    return false;
    if (roleF.size    && !g.some(u => roleOf(u)   && roleF.has(roleOf(u))))     return false;
    if (!q) return true;
    // gameName always returns a string ("" for nameless NPCs/monsters). Never
    // call .toLowerCase() on a bare gameName() — that used to throw and kill
    // the entire hub filter (search "fully broken" on prod + local).
    return g.some(u =>
      (u.id || "").toLowerCase().includes(q) ||
      (u.name || "").toLowerCase().includes(q) ||
      (u.slug || "").toLowerCase().includes(q) ||
      (u.hero_name || "").toLowerCase().includes(q) ||
      // also match the localized name so e.g. a Korean user can search 한글 names
      (E7.gameName(u) || "").toLowerCase().includes(q) ||
      (E7.gameName(u, "hero_name") || "").toLowerCase().includes(q)
    );
  });
  // Sort: LOCAL-ONLY unreleased units pin above everything (they're what you're
  // here to inspect, and they have no release date so they'd otherwise sink to
  // the bottom), then ANNOUNCED (official preview, pre-banner), then NEW, then
  // UPDATED (recently-changed existing units), then the chosen sort mode:
  //   "timeline" — by release date, NEWEST first (units with no timeline date
  //                fall to the bottom and tie-break alphabetically);
  //   "az"       — alphabetically by hero name, then by id.
  const pinRank = g => g.some(x => x.unreleased) ? 0
                     : g.some(x => x.announced)  ? 1
                     : g.some(x => x.new)        ? 2
                     : g.some(x => x.modified)   ? 3 : 4;
  // A group's timeline key is the EARLIEST release date among its variants
  // (a hero debuts once; skins don't move the card). Null if none are dated.
  const dateOf = g => {
    let best = null;
    for (const v of g) { const d = v.released; if (d && (!best || d < best)) best = d; }
    return best;
  };
  const byName = (a, b) => {
    // Sort by the LOCALIZED name so A→Z is alphabetical in the active language.
    const na = (E7.gameName(a[0], "hero_name") || E7.gameName(a[0]) || "").toLowerCase();
    const nb = (E7.gameName(b[0], "hero_name") || E7.gameName(b[0]) || "").toLowerCase();
    if (na && nb && na !== nb) return na.localeCompare(nb);
    if (na && !nb) return -1;
    if (!na && nb) return  1;
    return (a[0].id || "").localeCompare(b[0].id || "");
  };
  list.sort((a,b) => {
    const ra = pinRank(a), rb = pinRank(b);
    if (ra !== rb) return ra - rb;
    if (sortMode === "timeline") {
      const da = dateOf(a), db = dateOf(b);
      if (da && db) { if (da !== db) return db.localeCompare(da); }  // newest first
      else if (da) return -1;   // dated before undated
      else if (db) return  1;
      // both undated, or same date -> alphabetical tie-break (falls through)
    }
    return byName(a, b);
  });
  return { list, groups, kindCounts, kinds };
}

function wireHubFormSwap() {
  // Cards are real <a href="#/u/..."> anchors — gives native middle-click /
  // right-click "Open in new tab" + Ctrl/Cmd-click without any extra JS.
  // Form-swap pills inside thumbs: preview a sibling variant's pose without
  // navigating. Visual-only — does NOT change the card's detail-page target.
  // preventDefault is required because the pill is nested inside the card's
  // <a>; stopPropagation alone isn't enough to block the anchor on some
  // browsers when the click target is a descendant.
  document.querySelectorAll(".form-swap button").forEach(b =>
    b.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const img = b.closest(".thumb").querySelector("img");
      if (!img) return;
      img.removeAttribute("style");
      const t = b.dataset.fsTrim;
      if (t) img.dataset.trim = t; else delete img.dataset.trim;
      img.dataset.fallbacks = b.dataset.fsFallbacks || "[]";
      img.src = b.dataset.fsSrc;
      // applyTrimCrop fires on the resulting onload; ensure it runs even when
      // the image is already cached.
      if (img.complete && img.naturalWidth) applyTrimCrop(img);
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      // Retarget the card's <a href> at the previewed variant so middle-/right-
      // click "Open in new tab" lands on the form the user is actually looking at.
      const cardEl = b.closest(".card");
      if (cardEl) {
        const base = cardEl.dataset.base;
        const v = b.dataset.fsVariant || "";
        cardEl.setAttribute("href", "#/u/" + encodeURIComponent(base) + (v ? "/" + encodeURIComponent(v) : ""));
      }
      // Drop focus so :focus-within doesn't pin .form-swap visible after the
      // mouse leaves the card. Keyboard tab-focus is unaffected.
      b.blur();
    });
}

function wireHubSearchInput(i) {
  if (!i) return;
  // Debounced soft re-render: only the grid swaps — the focused <input> stays
  // mounted so mobile IME / mid-type keystrokes are never destroyed.
  i.oninput = (e) => {
    searchQ = e.target.value;
    clearTimeout(window._qDebounce);
    window._qDebounce = setTimeout(() => hub({ soft: true }), 120);
  };
  // ABC/123 toggle. Mobile keyboards only pick up an inputmode change after
  // blur + refocus, so swap the attribute then bounce focus to redraw the IME.
  const qm = $("#qmode");
  if (qm) qm.onclick = (e) => {
    e.preventDefault();
    qMode = qMode === "num" ? "text" : "num";
    i.setAttribute("inputmode", qMode === "num" ? "numeric" : "search");
    qm.textContent = qMode === "num" ? "ABC" : "123";
    qm.classList.toggle("on", qMode === "num");
    i.blur();
    i.focus();
    try { i.setSelectionRange(searchQ.length, searchQ.length); } catch (_) {}
  };
}
