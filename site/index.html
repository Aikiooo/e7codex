/**
 * Hub view. opts.soft = true → only refresh #hubGrid + #hubCount (keep #q mounted).
 * Used by the search debounce so mobile typing never loses characters mid-render.
 */
function hub(opts) {
  opts = opts || {};
  setNav("hub");
  const { list, groups, kindCounts, kinds } = hubFilteredList();
  const gridHtml = list.map(card).join("") || `<p class="empty">${escapeHtml(E7.t('hub_empty'))}</p>`;
  const countTxt = `${list.length} / ${groups.length}`;

  // Soft path: search / filter refresh without destroying the focused input.
  // Critical on mobile — full innerHTML replace drops IME composition + keystrokes
  // typed while the previous debounce was re-rendering the 600-card grid.
  const gridEl = document.getElementById("hubGrid");
  const countEl = document.getElementById("hubCount");
  const qEl = document.getElementById("q");
  if (opts.soft && gridEl && countEl && qEl) {
    countEl.textContent = countTxt;
    const loadMsg = document.getElementById("hubLoading");
    if (loadMsg) loadMsg.remove();
    gridEl.innerHTML = gridHtml;
    wireHubFormSwap();
    observeHubImages();
    requestAnimationFrame(() => {
      document.querySelectorAll(".thumb img").forEach(img => {
        if (img.complete && img.naturalWidth) applyTrimCrop(img);
      });
    });
    return;
  }

  // Preserve focus + caret across a full rebuild (load→first paint, filter
  // chip, kind tab). Soft path above already keeps the node mounted.
  const prevQ = document.getElementById("q");
  const keepFocus = prevQ && document.activeElement === prevQ;
  let caret = searchQ.length;
  try { if (keepFocus && typeof prevQ.selectionStart === "number") caret = prevQ.selectionStart; } catch (_) {}

  $("#app").innerHTML = `
    ${demo ? `<div class="demo">DEMO DATA — run <code>python build_index.py --img /path/to/img_output --raw /path/to/output --out ./site</code> then reload.</div>` : ""}
    <div class="bar" id="hubBar">
      <div class="q-wrap">
        <input id="q" placeholder="${escapeHtml(E7.t('hub_search_ph'))}" value="${escapeHtml(searchQ)}" inputmode="${qMode==='num'?'numeric':'search'}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button id="qmode" type="button" class="qmode${qMode==='num'?' on':''}" title="${escapeHtml(E7.t('kbd_toggle_t'))}">${qMode==='num'?'ABC':'123'}</button>
      </div>
      <span class="count" id="hubCount">${countTxt}</span>
      <div class="sort-toggle" role="group" aria-label="${escapeHtml(E7.t('hub_sort_aria'))}">
        <span class="sort-label">${escapeHtml(E7.t('hub_sort'))}</span>
        <button type="button" data-sort="timeline" class="${sortMode==='timeline'?'on':''}" title="${escapeHtml(E7.t('sort_timeline_t'))}">${escapeHtml(E7.t('sort_timeline'))}</button>
        <button type="button" data-sort="az" class="${sortMode==='az'?'on':''}" title="${escapeHtml(E7.t('sort_az_t'))}">${escapeHtml(E7.t('sort_az'))}</button>
      </div>
    </div>
    <div class="kinds">${kinds.map(k => {
      const label = k === "all" ? E7.t("kind_all") : E7.t("kind_"+k, {}, (KIND_LABELS[k]||k).toUpperCase());
      const n = k === "all" ? groups.length : (kindCounts[k]||0);
      return `<button data-k="${k}" class="${k===kindF?'on':''}">${escapeHtml(label)}<span class="n">${n}</span></button>`;
    }).join("")}</div>
    <div class="filters">
      <div class="fgroup">
        <span class="flabel">${escapeHtml(E7.t('filt_element'))}</span>
        ${ELEMENTS.map(e =>
          `<button class="chip el-${e} ${elementF.has(e)?'on':''}" data-el="${e}">${escapeHtml(E7.gameTerm("element", e))}</button>`
        ).join("")}
      </div>
      <div class="fgroup">
        <span class="flabel">${escapeHtml(E7.t('filt_class'))}</span>
        ${ROLES.map(r =>
          `<button class="chip ${roleF.has(r)?'on':''}" data-role="${r}">${escapeHtml(E7.gameTerm("class", r))}</button>`
        ).join("")}
      </div>
      <div class="fgroup">
        <span class="flabel">${escapeHtml(E7.t('filt_rarity'))}</span>
        ${RARITIES.map(r =>
          `<button class="chip rar ${rarityF.has(r)?'on':''}" data-rar="${r}">${'★'.repeat(r)}</button>`
        ).join("")}
      </div>
      ${(elementF.size || rarityF.size || roleF.size) ? `<button class="chip clear" data-clear="1">${escapeHtml(E7.t('filt_clear'))}</button>` : ""}
    </div>
    <div class="grid" id="hubGrid">${gridHtml}</div>`;

  const i = $("#q");
  wireHubSearchInput(i);
  if (keepFocus && i) {
    queueMicrotask(() => {
      i.focus();
      try { i.setSelectionRange(caret, caret); } catch (_) {}
    });
  }
  document.querySelectorAll(".kinds button").forEach(b => b.onclick = () => { kindF = b.dataset.k; hub(); });
  document.querySelectorAll(".sort-toggle button").forEach(b => b.onclick = () => {
    if (b.dataset.sort === sortMode) return;
    sortMode = b.dataset.sort;
    try { localStorage.setItem("hub_sort", sortMode); } catch (_) {}
    hub();
  });
  document.querySelectorAll(".filters .chip").forEach(b => b.onclick = () => {
    if (b.dataset.clear) { elementF.clear(); rarityF.clear(); roleF.clear(); }
    else if (b.dataset.el)   { elementF.has(b.dataset.el) ? elementF.delete(b.dataset.el) : elementF.add(b.dataset.el); }
    else if (b.dataset.rar)  { const r = +b.dataset.rar; rarityF.has(r) ? rarityF.delete(r) : rarityF.add(r); }
    else if (b.dataset.role) { roleF.has(b.dataset.role) ? roleF.delete(b.dataset.role) : roleF.add(b.dataset.role); }
    hub();
  });
  wireHubFormSwap();
  // Lazy-load: lifts data-src onto src as cards enter the viewport. Recreated
  // per render so detached nodes from the previous render don't accumulate.
  observeHubImages();
  // For images already in the browser cache, onload won't re-fire — apply crop now.
  requestAnimationFrame(() => {
    document.querySelectorAll(".thumb img").forEach(img => {
      if (img.complete && img.naturalWidth) applyTrimCrop(img);
    });
  });
}

const PG_LABEL = { heroes: "Heroes", art: "Artwork", effects: "Effects", engine: "Engine / data", other: "Other" };
const PG_ORDER = ["heroes", "art", "effects", "engine", "other"];
const CHANGE_SYM = { added: "+", removed: "−", changed: "~" };
// "update" is a derived kind: an `added` row for a hero whose base group already
// has a pre-existing (non-`new`) member — i.e. NEW CONTENT on an existing unit,
// not a brand-new release. It reuses the "+" glyph but gets a distinct yellow so
// the user can tell a freshly-released hero (green +) from one that just gained a
// skin/rig (yellow +). Removed/changed keep their own glyph + colour.
const KIND_SYM = { added: "+", update: "+", changed: "~", removed: "−" };
// Sort weight for the thumbnail strip: new releases first, then updates, then
// content changes, then removals.
const KIND_SORT = { added: 0, update: 1, changed: 2, removed: 3 };
const CHANGE_RANK = { added: 3, changed: 2, removed: 1 };

// Classify a patch entry into added / update / changed / removed. An "added" row
// is downgraded to "update" (yellow +) when this content attaches to a
// PRE-EXISTING unit — its base group contains a member that is already released
// and not itself new this window (e.g. a new skin on an old hero). A brand-new
// entity — hero, NPC, or monster — has no such member (the whole group is new, or
// its members carry no release date), so it stays "added" (green +). NPCs/monsters
// never receive the `new` flag, so we key off `released` rather than `new` alone.
function patchKind(e) {
  if (e.change === "added" && e.unit) {
    const g = BY_BASE.get(e.unit);
    if (g && g.some(x => !x.new && x.released)) return "update";
  }
  return e.change;
}

// Collapse a path to its bare filename stem (drop the directory and every known
// asset extension), so the dozen files that make up one rig/asset can be folded
// into a single rollup row instead of spamming model/x.atlas/.scsp/.sct/.timeline.
const PATCH_EXT_RE = /\.(scsp|atlas|sct|png|webp|jpg|jpeg|timeline|particle|cfx|bin|db|unpacked)$/i;
function stemOf(path) {
  let n = (path || "").split("/").pop() || "";
  let prev;
  do { prev = n; n = n.replace(PATCH_EXT_RE, ""); } while (prev !== n);
  return n;
}
function cleanPath(path) {
  const parts = (path || "").split("/");
  parts[parts.length - 1] = stemOf(path);
  return parts.join("/");
}
// Fold a group's per-file rows into one row per unit (by slug) or per asset stem.
// The collapsed row carries the most salient change, a named label when any
// member had one, the first available preview, and a file count.
function dedupRollup(items) {
  const m = new Map();
  for (const e of items) {
    // Key by slug when known, else by directory+stem so a rig's
    // model/x.{atlas,scsp,sct,timeline} fold into one row WITHOUT colliding
    // same-named files from different folders (face/foo.png vs model/foo.png).
    const key = e.slug || cleanPath(e.path);
    let g = m.get(key);
    if (!g) { g = { ...e, _n: 0 }; m.set(key, g); }
    g._n++;
    if ((CHANGE_RANK[e.change] || 0) > (CHANGE_RANK[g.change] || 0)) g.change = e.change;
    if (e.name && !g.name) g.name = e.name;
    if (e.preview && !g.preview) g.preview = e.preview;
    if (e.unit && !g.unit) g.unit = e.unit;
  }
  return [...m.values()];
}

function fmtBytes(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}

function patchEntryRow(e) {
  const kind = patchKind(e);
  const sym = KIND_SYM[kind] || "·";
  // Collapsed rows (multiple files folded into one) show a file count; single
  // rows keep the byte-size delta.
  const meta = (e._n && e._n > 1)
    ? ` <span class="pe-size">· ${e._n} files</span>`
    : (e.old_size != null
        ? ` <span class="pe-size">${fmtBytes(e.old_size)} → ${fmtBytes(e.new_size)}</span>` : "");
  const label = e.name ? escapeHtml(e.name) : `<code>${escapeHtml(cleanPath(e.path))}</code>`;
  // Changed/added artwork carries a `preview` URL (a transient per-pack copy or a
  // reused already-hosted image) — render it as a clickable lightbox thumbnail.
  const prev = e.preview
    ? `<a class="pe-prev" href="${escapeHtml(e.preview)}" data-zoom data-cap="${escapeHtml(e.path)}" target="_blank" rel="noopener"><img loading="lazy" src="${escapeHtml(e.preview)}" alt=""></a>`
    : "";
  return `<div class="pe pe-${kind}${e.preview ? ' has-prev' : ''}">${prev}<span class="pe-sym">${sym}</span> ${label}${meta}</div>`;
}

function patchBlock(p) {
  const groups = p.groups || {};
  // Visual cards: hero/art entries that resolved to a staged pose thumbnail,
  // ONE per unit. A rig is several files (.scsp/.atlas/.sct) that all resolve to
  // the same slug+pose, so without this a single added/changed unit would show 2-3
  // identical cards. The per-file detail still lives in the "file changes by area"
  // rollup below. When a unit's files carry mixed change types, the most salient
  // badge wins (added > changed > removed) — CHANGE_RANK is module-level.
  // Incidental shop/equipment art (EE icons, gacha banners) resolves to a hero
  // slug but isn't a hero-identity change — a re-compressed banner or a new EE
  // icon shouldn't promote that hero into the headline strip as if they were
  // added/reworked this pack. Keep those rows in the "file changes" rollup, just
  // don't surface them as thumbnails.
  const STRIP_SKIP = /icon_eq_exclusive|(?:^|\/)gacha_/i;
  const byUnit = new Map();
  for (const g of ["heroes", "art"]) for (const e of (groups[g] || [])) {
    if (!e.pose) continue;
    if (g === "art" && STRIP_SKIP.test(e.path || "")) continue;
    const cur = byUnit.get(e.slug);
    if (!cur) byUnit.set(e.slug, { ...e });
    else if ((CHANGE_RANK[e.change] || 0) > (CHANGE_RANK[cur.change] || 0)) cur.change = e.change;
  }
  // Sort the thumbnail strip by update type: new releases (green +) first, then
  // updates to existing units (yellow +), then content changes (~), then removals.
  const thumbs = [...byUnit.values()].sort((a, b) =>
    (KIND_SORT[patchKind(a)] - KIND_SORT[patchKind(b)]) ||
    (a.name || a.slug || "").localeCompare(b.name || b.slug || ""));
  const thumbHtml = thumbs.length ? `<div class="patch-thumbs">${thumbs.map(e => {
    const k = patchKind(e);
    return `
    <a class="pt" href="#/u/${encodeURIComponent(e.unit || e.slug)}" title="${escapeHtml((e.name || e.slug))} — ${k}">
      <span class="pt-badge pt-${k}">${KIND_SYM[k] || "·"}</span>
      <img loading="lazy" src="${escapeHtml(e.pose)}" alt="${escapeHtml(e.name || e.slug)}">
      <span class="pt-name">${escapeHtml(e.name || e.slug)}</span>
    </a>`; }).join("")}</div>` : "";

  // Text rollup per group. Each group's per-file rows are collapsed to one row
  // per unit/asset stem (a rig is ~5 files; without this a single change spams
  // model/x.atlas/.scsp/.sct/.timeline as separate lines).
  // Within a group: rows with a preview thumbnail stay visible; path-only rows
  // (engine bins, particles, nameless files) sit behind a closed <details> so
  // casual browsing isn't a wall of code paths.
  const plainSummary = (n) => escapeHtml(
    E7.t("patch_plain_rows", { n }, "{n} path-only rows (no image)")
  );
  const groupHtml = PG_ORDER.filter(g => (groups[g] || []).length).map(g => {
    const rows = dedupRollup(groups[g]);
    const withImg = rows.filter(e => e.preview);
    const plain = rows.filter(e => !e.preview);
    const imgHtml = withImg.length
      ? `<div class="pg-items">${withImg.map(patchEntryRow).join("")}</div>` : "";
    // If a group is entirely path-only, the <details> IS the content (still
    // closed by default). Count in the group label stays total rollup size.
    const plainHtml = plain.length ? `
      <details class="pg-plain">
        <summary title="${escapeHtml(E7.t(
          "patch_plain_rows_hint",
          {},
          "Engine, data, and other files without a thumbnail — expand to list paths"
        ))}">${plainSummary(plain.length)}</summary>
        <div class="pg-items">${plain.map(patchEntryRow).join("")}</div>
      </details>` : "";
    return `
    <div class="patch-group">
      <span class="pg-label">${PG_LABEL[g]} <span class="pg-n">${rows.length}</span></span>
      ${imgHtml}${plainHtml}
    </div>`; }).join("");

  const c = p.counts || {};
  return `<div class="patch">
    <div class="patch-head">
      <h3>Data pack${p.label ? ` · ${escapeHtml(p.label)}` : ""}</h3>
      <span class="code count">+${c.added||0} · −${c.removed||0} · ~${c.changed||0}</span>
      ${p.date ? `<span class="code">${escapeHtml(p.date)}</span>` : ""}
    </div>
    ${thumbHtml}
    <details class="patch-raw"${thumbs.length ? "" : " open"}><summary>file changes by area</summary>${groupHtml}</details>
  </div>`;
}

function updatesPane() {
  // #/updates          → event gallery (default — permanent showcase)
  // #/updates/packs    → pack-to-pack patch diff (transient "what landed")
  const h = location.hash || "#/updates";
  if (h === "#/updates/packs" || h === "#/updates/patches" || h === "#/updates/diff") return "packs";
  return "events";
}

      const u = UPDATES[label];

      const bonusHeroes = u.bonus_heroes || [];
      const eventArts = u.artifacts || [];
      const title = E7.eventTitle(u.codename, label);   // localized event title
      const bannerN = (u.banners || []).length;
      const parts = [];

      }
      if (eventArts.length) parts.push(T(
        eventArts.length === 1 ? "upd_n_artifact" : "upd_n_artifacts",
        eventArts.length === 1 ? "{n} artifact" : "{n} artifacts",
        { n: eventArts.length }));
      if (bonusHeroes.length) parts.push(T("upd_n_bonus", "{n} bonus", { n: bonusHeroes.length }));
      if ((u.related_heroes || []).length && heroes.some(h => h.role !== "related")) {

      if (u.db_only) parts.push(T("upd_db_only", "DB only"));
      const skinLbl = T("upd_badge_skin", "skin");

          return `<a class="is-arti" href="${escapeHtml(href)}"${zoom} target="_blank" rel="noopener" title="${escapeHtml(name)} · ${escapeHtml(artiLbl)}">${badgeHtml}${pose}<span class="uc-name">${escapeHtml(name)}</span></a>`;

        const b = badge || "";
        const badgeHtml = b ? `<span class="uc-badge">${escapeHtml(b)}</span>` : "";
        return `<a href="#/u/${encodeURIComponent(base)}" title="${escapeHtml(h.name)}${b ? " · " + b : ""}">${badgeHtml}${pose}<span class="uc-name">${escapeHtml(h.name)}</span></a>`;

      const castBlock = (list, kind, lbl) => {

        return `<div class="upd-cast-block ${kind}">
          <p class="upd-cast-lbl">${escapeHtml(lbl)}<span class="n">${list.length}</span></p>
          <div class="upd-cast">${list.map(h => castCell(h,
            kind === "featured"
              ? (h.kind === "artifact" ? artiLbl : (h.variant ? skinLbl : ""))
              : "")).join("")}</div>
        </div>`;
      };
      const relatedHeroes = u.related_heroes || [];
      // Featured strip = hero stars + event artifacts (same row, artifact badge).
      const featuredList = heroes.concat(eventArts);
      const featLabel = heroes.length && heroes.every(h => h.role === "related") && !eventArts.length
        ? T("upd_cast_stage", "Stage cast")
        : T("upd_cast_featured", "Featured");
      const castHtml = castBlock(featuredList, "featured", featLabel)

// Per-hero voice section. Actor credits come from data/voices.json (decoded from
// character_voice.db). Playable voice lines come from data/voices_audio.json (a
// catalog built from the FMOD bank sample names — see tools/extract_voice_audio.py);
// the audio OGGs are served from VOICE_BASE/<lang>/voc_<slug>_<action>_<take>.ogg.
// Clicking a clip opens the shared lightbox in audio mode.
const VOICE_LANGS = [["en","EN"],["ja","JA"],["kr","KR"],["zhs","CN"]];   // actor-credit langs
const AUDIO_LANGS = [["en","EN"],["ja","JA"],["ko","KR"]];               // available audio langs
const VOICE_CATS  = [["battle","Battle"],["skill","Skill"],["camping","Camping"],["misc","Other"]];
// Priority order for action rows (lower = earlier); unknown actions sort last by label.
const ACTION_ORDER = ["skill1","sk1","shout","skill2","sk2","skill3","sk3","skill3_1","sk3_1",
  "skill3_2","sk3_2","skill3_3","sk3_3","skill3_4","sk3_4","attacked","dmg","answer","call",
  "win","lose","defeat","dead","lvup","lv","get","idle","idle_s","utterance","camping","emotion","touch"];
// Group clip actions onto their own rows: skills | combat | status events | rest.
const VCLIP_GROUPS = [
  ["skills", "Skills",  a => a === "shout" || a.startsWith("skill") || /^sk\d/.test(a)],
  ["combat", "Combat",  a => ["attacked","dmg","answer","call"].includes(a)],
  ["status", "Status",  a => ["win","lose","defeat","dead","lvup","lv","get"].includes(a)],
  ["other",  "Idle & misc", () => true],
];
let voiceLang = "en";
function voiceFor(u) { return VOICES[u.id] || VOICES[u.base_id] || null; }
function clipsFor(u) {
  if (VOICE_CLIPS[u.id]) return [u.id, VOICE_CLIPS[u.id]];
  if (u.base_id && VOICE_CLIPS[u.base_id]) return [u.base_id, VOICE_CLIPS[u.base_id]];
  return [null, null];
}
function clipLangHas(clips, lang) {
  return Object.values(clips).some(c => (c.takes[lang] || []).length);
}
// Render the grouped, playable clip rows for ONE language. Only actions/takes
// that have an OGG on disk for `lang` are shown (per-lang availability lives in
// the catalog), so a JA-only take never renders a dead EN button.
function renderVoiceClips(clipSlug, clips, lang) {
  const actions = Object.keys(clips)
    .filter(a => (clips[a].takes[lang] || []).length)
    .sort((a,b) => {
      const ia = ACTION_ORDER.indexOf(a), ib = ACTION_ORDER.indexOf(b);
      return (ia<0?999:ia) - (ib<0?999:ib) || clips[a].label.localeCompare(clips[b].label);
    });
  const buckets = {};
  for (const act of actions) {
    const grp = (VCLIP_GROUPS.find(([,,test]) => test(act)) || VCLIP_GROUPS[VCLIP_GROUPS.length-1])[0];
    const { label } = clips[act];
    const takes = clips[act].takes[lang];
    (buckets[grp] = buckets[grp] || []).push(...takes.map(t => {
      const lab = takes.length > 1 ? `${label} ${t}` : label;
      return `<button class="vlclip" data-slug="${clipSlug}" data-action="${escapeHtml(act)}" data-take="${t}" data-label="${escapeHtml(label)}">▶ ${escapeHtml(lab)}</button>`;
    }));
  }
  return VCLIP_GROUPS.filter(([k]) => buckets[k]).map(([k, glab]) =>
    `<div class="vl-group"><div class="vl-cat">${escapeHtml(E7.t('vgrp_'+k, {}, glab))}</div><div class="vl-items">${buckets[k].join("")}</div></div>`).join("");
}
function voiceSection(u) {
  const v = voiceFor(u);
  const [clipSlug, clips] = clipsFor(u);
  if (!v && !clips) return "";
  let html = `<p class="section-label">${E7.t('hdr_voice')}</p>`;
  if (v && v.actors) {
    const cells = VOICE_LANGS.filter(([k]) => v.actors[k])
      .map(([k,lab]) => `<span class="va"><span class="lang">${lab}</span><span class="nm">${escapeHtml(v.actors[k])}</span></span>`).join("");
    if (cells) html += `<div class="voice-actors">${cells}</div>`;
  }
  if (clips) {
    // Only offer languages this hero actually has clips for; pick an effective
    // lang (the current global pick, or the first available) for the first render.
    const avail = AUDIO_LANGS.filter(([k]) => clipLangHas(clips, k));
    const lang = avail.some(([k]) => k === voiceLang) ? voiceLang : (avail[0] ? avail[0][0] : voiceLang);
    const langBtns = avail.map(([k,lab]) =>
      `<button class="vlang${k===lang?' on':''}" data-lang="${k}">${lab}</button>`).join("");
    html += `<div class="vlang-row">${langBtns}<span class="vlang-hint">${E7.t('voice_hint')}</span></div>`;
    html += `<div class="voice-lines" id="voiceClips" data-clipslug="${clipSlug}">${renderVoiceClips(clipSlug, clips, lang)}</div>`;
  } else if (v && (v.lines||[]).length) {
    // fallback: non-playable DB catalog (heroes without extracted audio yet)
    const byCat = {};
    for (const ln of v.lines) (byCat[ln.category] = byCat[ln.category] || []).push(ln);
    const groups = VOICE_CATS.filter(([c]) => byCat[c]).map(([c,lab]) => {
      const items = byCat[c].map(ln => `<span title="${escapeHtml(ln.event)}">${escapeHtml(ln.label)}</span>`).join("");
      return `<div class="vl-group"><div class="vl-cat">${escapeHtml(E7.t('vcat_'+c, {}, lab))} · ${byCat[c].length}</div><div class="vl-items">${items}</div></div>`;
    }).join("");
    html += `<div class="voice-lines">${groups}</div>`;
  }
  return html;
}

// ===== Profile frame compositor (TASKS #32) ==================================
// All frames (official + UI): face_box 112 on canvas 148 (UIUtil.getUserIcon).
// Official borders: bit-exact RE art. UI/legacy: staged onto 148 with hole-match
// when the ornament fits, else contain. UI faces are circle-masked so square
// corners don't bleed past thin rings. Preview box is fixed — never resizes.
// _su / _l are wide list art and do NOT fit the profile frame; we only use _s.
let FRAMES_META = null;   // { canvas, face_box, frames: [...] } | null after load fail
let _framesPromise = null;
// Arena = classic/seasonal PvP ranks; RTA = World Arena (ssN_rta*).
// ui = battle hero_s rings + legacy device frames (not unlockable profile borders).
const FRAME_CATS = ["all", "arena", "rta", "tournament", "clan", "abyss", "event", "ui", "other"];

/** Per-frame face box: guide uses mapped 96-slot; others use meta 112. */
function frameFaceBoxFor(fr, metaFaceBox) {
  if (fr && typeof fr.face_box === "number" && fr.face_box > 0) return fr.face_box;
  return metaFaceBox || 112;
}

/** Thumb face CSS. UI gets circle clip. Off-center plates use face_cx/cy %. */
function frameThumbFaceStyle(fr, metaFaceBox, metaCanvas) {
  const S = (fr && fr.size) || metaCanvas || 148;
  const box = frameFaceBoxFor(fr, metaFaceBox);
  const pct = Math.min(100, Math.max(8, (box / S) * 100));
  const fcx = (fr && typeof fr.face_cx === "number") ? fr.face_cx : S / 2;
  const fcy = (fr && typeof fr.face_cy === "number") ? fr.face_cy : S / 2;
  const left = (fcx / S) * 100 - pct / 2;
  const top = (fcy / S) * 100 - pct / 2;
  const ui = !!(fr && (fr.fit === "ui" || fr.category === "ui"));
  return {
    css: `left:${left}%;top:${top}%;width:${pct}%;height:${pct}%`,
    ui,
  };
}

function unitProfileFaces(u) {
  // Profile-icon faces only: face_<stem>_s.png staged under assets/<unit>/
  const arts = u.artworks || [];
  const out = [];
  const seen = new Set();
  for (const a of arts) {
    const m = /(?:^|\/)(face_(.+)_s\.png)$/i.exec(a);
    if (!m) continue;
    if (seen.has(a)) continue;
    seen.add(a);
    out.push({ url: a, file: m[1], stem: m[2] });
  }
  // Prefer the unit's own slug face first (skin/base match)
  out.sort((a, b) => {
    const ap = a.stem === u.id ? 0 : 1;
    const bp = b.stem === u.id ? 0 : 1;
    return ap - bp || a.stem.localeCompare(b.stem);
  });
  return out;
}

function ensureFrames() {
  if (FRAMES_META) return Promise.resolve(FRAMES_META);
  if (_framesPromise) return _framesPromise;
  _framesPromise = dataJson("data/frames.json", null).then(j => {
    FRAMES_META = (j && Array.isArray(j.frames) && j.frames.length) ? j : null;
    return FRAMES_META;
  });
  return _framesPromise;
}

const _frameImgCache = new Map();
function loadImg(url) {
  if (_frameImgCache.has(url)) return _frameImgCache.get(url);
  const p = new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("img " + url));
    im.src = url;
  });
  _frameImgCache.set(url, p);
  return p;
}

let _frameState = null;  // active modal state

function closeFrameComposer() {
  const modal = document.getElementById("frameModal");
  if (modal) {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
  }
  _frameState = null;
  // Restore page scroll (locked while the modal is open on small devices).
  document.documentElement.style.overflow = "";
  document.body.style.overflow = "";
}

async function openFrameComposer(u) {
  const faces = unitProfileFaces(u);
  if (!faces.length) return;

  const modal = document.getElementById("frameModal");
  const canvas = document.getElementById("frameCanvas");
  const grid = document.getElementById("frameGrid");
  const catsEl = document.getElementById("frameCats");
  const searchEl = document.getElementById("frameSearch");
  const facesWrap = document.getElementById("frameFaces");
  const facesRow = document.getElementById("frameFacesRow");
  const dlBtn = document.getElementById("frameDownload");
  if (!modal || !canvas || !grid) return;

  // Localize chrome each open (lang may have changed).
  document.getElementById("frameTitle").textContent = E7.t("frame_title");
  document.getElementById("frameFaceLabel").textContent = E7.t("frame_face");
  dlBtn.textContent = E7.t("frame_download");
  searchEl.placeholder = E7.t("frame_search_ph");

  const meta = await ensureFrames();
  const canvasSize = (meta && meta.canvas) || 148;
  const faceBox = (meta && meta.face_box) || 112;
  canvas.width = canvasSize;
  canvas.height = canvasSize;

  const frames = (meta && meta.frames) || [];
  _frameState = {
    u, faces, faceIdx: 0, frameId: null, cat: "all", q: "",
    canvasSize, faceBox, frames, name: displayName(u) || u.id,
  };

  // Face picker (usually one; skins on same unit folder can have several)
  if (faces.length > 1) {
    facesWrap.hidden = false;
    facesRow.innerHTML = faces.map((f, i) =>
      `<button type="button" data-fi="${i}" class="${i === 0 ? "on" : ""}" title="${escapeHtml(f.stem)}">
         <img src="${escapeHtml(f.url)}" alt="${escapeHtml(f.stem)}"></button>`
    ).join("");
    facesRow.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        _frameState.faceIdx = +b.dataset.fi;
        facesRow.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        renderFrameGrid();   // refresh face under each frame thumb
        paintFramePreview();
      };
    });
  } else {
    facesWrap.hidden = true;
    facesRow.innerHTML = "";
  }

  // Category chips
  const present = new Set(frames.map(f => f.category));
  catsEl.innerHTML = FRAME_CATS
    .filter(c => c === "all" || present.has(c))
    .map(c => `<button type="button" data-cat="${c}" class="${c === "all" ? "on" : ""}">${escapeHtml(E7.t("frame_cat_" + c, {}, c))}</button>`)
    .join("");
  catsEl.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      _frameState.cat = b.dataset.cat;
      catsEl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      renderFrameGrid();
    };
  });

  searchEl.value = "";
  searchEl.oninput = () => {
    _frameState.q = searchEl.value.trim().toLowerCase();
    renderFrameGrid();
  };

  dlBtn.onclick = () => downloadFramePng();
  renderFrameGrid();
  await paintFramePreview();

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  // Prevent background page scroll while the list is being dragged on mobile.
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
}

function renderFrameGrid() {
  const st = _frameState;
  const grid = document.getElementById("frameGrid");
  if (!st || !grid) return;
  const q = st.q;
  const list = st.frames.filter(f => {
    if (st.cat !== "all" && f.category !== st.cat) return false;
    if (!q) return true;
    return (f.label || "").toLowerCase().includes(q) ||
           (f.id || "").toLowerCase().includes(q) ||
           (f.file || "").toLowerCase().includes(q);
  });

  const noneOn = st.frameId === null;
  const faceUrl = (st.faces[st.faceIdx] && st.faces[st.faceIdx].url) || "";
  // Face is always face_box (112); thumbs only change frame scale/canvas.
  const noneStyle = frameThumbFaceStyle(null, st.faceBox, st.canvasSize);
  const noneFace = faceUrl
    ? `<img class="ft-face" style="${noneStyle.css}" src="${escapeHtml(faceUrl)}" alt="" draggable="false">`
    : "";
  let html = `<button type="button" class="frame-cell none-cell${noneOn ? " on" : ""}" data-fid="" title="${escapeHtml(E7.t("frame_none"))}">
      <span class="frame-thumb">${noneFace}</span>
      <span class="fn">${escapeHtml(E7.t("frame_none"))}</span>
    </button>`;
  if (!st.frames.length) {
    html = `<p class="empty" style="grid-column:1/-1;padding:12px 4px">${escapeHtml(E7.t("frame_empty"))}</p>`;
  } else {
    html += list.map(f => {
      const ts = frameThumbFaceStyle(f, st.faceBox, st.canvasSize);
      const faceCls = ts.ui ? "ft-face ft-ui" : "ft-face";
      const faceImg = faceUrl
        ? `<img class="${faceCls}" style="${ts.css}" src="${escapeHtml(faceUrl)}" alt="" draggable="false">`
        : "";
      // Cache-bust UI PNGs when catalog version changes (same path, new pixels).
      const frSrc = (ts.ui && FRAMES_META && FRAMES_META.version)
        ? `${f.path}?v=${FRAMES_META.version}`
        : f.path;
      return `<button type="button" class="frame-cell${st.frameId === f.id ? " on" : ""}" data-fid="${escapeHtml(f.id)}" title="${escapeHtml(f.label || f.id)}">
         <span class="frame-thumb">${faceImg}<img class="ft-border" loading="lazy" src="${escapeHtml(frSrc)}" alt="" draggable="false"></span>
         <span class="fn">${escapeHtml(f.label || f.id)}</span>
       </button>`;
    }).join("");
  }
  grid.innerHTML = html;
  grid.querySelectorAll(".frame-cell").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.fid;
      st.frameId = id ? id : null;
      renderFrameGrid();
      paintFramePreview();
    };
  });
}

async function paintFramePreview() {
  const st = _frameState;
  const canvas = document.getElementById("frameCanvas");
  const dlBtn = document.getElementById("frameDownload");
  if (!st || !canvas) return;
  const ctx = canvas.getContext("2d");
  // Official: 148/112. Guide (and any native plate): per-frame size + face center.
  const metaFace = st.faceBox || 112;
  const metaCanvas = st.canvasSize || 148;

  const face = st.faces[st.faceIdx];
  if (!face) {
    if (dlBtn) dlBtn.disabled = true;
    return;
  }
  try {
    const faceIm = await loadImg(face.url);
    let frIm = null;
    let fr = null;
    let isUi = false;
    if (st.frameId) {
      fr = st.frames.find(f => f.id === st.frameId) || null;
      if (fr) {
        isUi = fr.fit === "ui" || fr.category === "ui";
        const frUrl = isUi && FRAMES_META && FRAMES_META.version
          ? `${fr.path}?v=${FRAMES_META.version}`
          : fr.path;
        frIm = await loadImg(frUrl);
      }
    }

    // Bitmap size: official 148; guide native 160; etc.
    let S = metaCanvas;
    if (frIm) {
      S = frIm.naturalWidth || metaCanvas;
      if (fr && typeof fr.size === "number" && fr.size > 0) S = fr.size;
    }
    const faceBox = frameFaceBoxFor(fr, metaFace);
    // Plate center in frame coords (guide red plate is off-mid at 79,78).
    const fcx = (fr && typeof fr.face_cx === "number") ? fr.face_cx : S / 2;
    const fcy = (fr && typeof fr.face_cy === "number") ? fr.face_cy : S / 2;

    canvas.width = S;
    canvas.height = S;
    // Fixed CSS display size so the preview box doesn't jump (bitmap may be 160).
    canvas.style.width = "148px";
    canvas.style.height = "148px";
    ctx.clearRect(0, 0, S, S);
    ctx.globalCompositeOperation = "source-over";

    const scale = Math.min(faceBox / faceIm.naturalWidth, faceBox / faceIm.naturalHeight);
    const dw = faceIm.naturalWidth * scale;
    const dh = faceIm.naturalHeight * scale;
    const dx = fcx - dw / 2;
    const dy = fcy - dh / 2;

    if (isUi) {
      // Circle-mask to the face plate (guide: r=48 on the red 96 plate).
      let maskR = faceBox / 2;
      if (fr && typeof fr.mask_r === "number" && fr.mask_r > 0) {
        maskR = fr.mask_r;
      }
      ctx.save();
      ctx.beginPath();
      ctx.arc(fcx, fcy, maskR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(faceIm, dx, dy, dw, dh);
      ctx.restore();
    } else {
      ctx.drawImage(faceIm, dx, dy, dw, dh);
    }

    if (frIm) {
      ctx.drawImage(frIm, 0, 0, S, S);
    }
    if (dlBtn) dlBtn.disabled = false;
  } catch (_) {
    if (dlBtn) dlBtn.disabled = true;
  }
}

function downloadFramePng() {
  const st = _frameState;
  const canvas = document.getElementById("frameCanvas");
  if (!st || !canvas) return;
  const face = st.faces[st.faceIdx];
  const framePart = st.frameId || "noframe";
  const stem = (face && face.stem) || st.u.id;
  const name = `e7codex_${stem}_${framePart}.png`;
  canvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
}

// Modal dismiss: close button, backdrop click, Escape
document.getElementById("frameClose").addEventListener("click", closeFrameComposer);
document.getElementById("frameModal").addEventListener("click", e => {

});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("frameModal").classList.contains("open")) {
    closeFrameComposer();
  }
});

  // quo), in the pose column's dead space under the render, or as a full-width
  // bottom row (thumb's left edge → content right edge). Try all three, keep
  // whichever measures strictly shortest — ties keep the status quo, so nothing
  // moves without a real gain. Try-measure-revert runs in one frame (no paint
  // between), and it's pure layout math: in the single-column layout all
  // placements are identical, so portrait devices are untouched by
  // construction, not by a width check.
  const fitArtSec = window._fitArtSec = () => {
    const det = document.querySelector(".detail");
    const sec = det && det.querySelector(".art-sec");
    if (!det || !sec || !sec.querySelector(".gallery")) return;
    const pose = det.children[0], info = det.children[1];
    // Stacked columns (single-column layout) have no dead space beside them —
    // relocating would only reorder content, so keep the status quo. Geometric
    // fact, not a viewport/orientation check.
    if (info.getBoundingClientRect().top >= pose.getBoundingClientRect().bottom) {
      if (sec.parentElement !== info) info.appendChild(sec);
      return;
    }
    // preference order on equal heights: info column > pose column > full width
    const spots = [info, pose, det];
    let best = spots[0], bestH = Infinity;
    for (const s of spots) {
      s.appendChild(sec);
      const h = det.offsetHeight;
      if (h < bestH - 1) { best = s; bestH = h; }
    }
    if (sec.parentElement !== best) best.appendChild(sec);
  };
  fitArtSec();
  // Lazy tiles change gallery wrap heights as they load; re-judge per load and
  // on resize (handler is global-once — it no-ops off the detail view).
  document.querySelectorAll(".art-sec img").forEach(im =>
    im.complete || im.addEventListener("load", () => window._fitArtSec(), { once: true }));
  if (!window._artFitWired) {
    window._artFitWired = true;
    let t;
    window.addEventListener("resize", () => {
      clearTimeout(t); t = setTimeout(() => window._fitArtSec(), 120);
    });
  }

  // Pose quick-switch: swap only the displayed pose image between variants
  // without rerouting. Variant-tabs above are the right tool for a full
  // page swap; this is for "what does the other skin's pose look like" without
  // losing the current variant's metadata/skills/gallery context.
  // Variant pose-switch (NOT the render-switch) — preview a sibling variant's
  // pose. `.render-switch button` is excluded so its handler below owns it.
  // Tracks the active variant's pose/thumb so the Base/Thumb toggle stays
  // pointed at the right pair after a variant preview.
  let rsPose  = u.pose || `assets/${u.id}/pose.png`;
  let rsThumb = u.thumb || "";
  let rsId    = u.id;
  function setPoseImage(url, capSuffix) {
    const img = document.getElementById("poseimg");
    if (!img || !url) return;
    img.removeAttribute("style");      // wipe applyTrimCrop's positioning
    img.removeAttribute("data-trim");  // use the image's own natural framing
    img.style.display = "";
    img.src = url;
    const anchor = img.parentElement;
    if (anchor && anchor.tagName === "A") {
      anchor.href = url;
      anchor.dataset.cap = `${rsId} · ${capSuffix}`;
      anchor.setAttribute("data-zoom", "");
    }
  }
  // Base/Thumb render toggle (only present when the unit has a thumb.png).
  const renderSwitch = document.querySelector(".render-switch");
  function applyRenderMode(mode) {
    const url = mode === "thumb" ? rsThumb : rsPose;
    if (!url) return;
    setPoseImage(url, mode === "thumb" ? "thumb.png" : "pose.png");
    if (renderSwitch) renderSwitch.querySelectorAll("button")
      .forEach(x => x.classList.toggle("on", x.dataset.rm === mode));
  }
  if (renderSwitch) renderSwitch.querySelectorAll("button")
    .forEach(b => b.onclick = () => applyRenderMode(b.dataset.rm));

  document.querySelectorAll(".pose-switch:not(.render-switch) button").forEach(b =>
    b.onclick = () => {
      rsPose = b.dataset.pose;
      rsThumb = b.dataset.thumb || "";
      rsId = b.dataset.id;
      setPoseImage(rsPose, "pose.png");   // previewing a variant always starts at Base
      document.querySelectorAll(".pose-switch:not(.render-switch) button")
        .forEach(x => x.classList.toggle("on", x === b));
      // Re-sync the render toggle: back to Base, and disable Thumb if this
      // variant has no baked thumb.png.
      if (renderSwitch) {
        renderSwitch.querySelectorAll("button")
          .forEach(x => x.classList.toggle("on", x.dataset.rm === "base"));
        const tb = renderSwitch.querySelector('button[data-rm="thumb"]');
        if (tb) { tb.disabled = !rsThumb; tb.style.opacity = rsThumb ? "" : ".4"; }
      }
    });
}

function emotes() {

const WP_CAT_LABEL = { lobby:"Lobby BG", event:"Event splash", episode:"Episode art", story:"Story bg" };

/**
 * Video URL for a lobby anim (optional clip variant). Never auto-fetched until Play.
 * - Local: assets/_illust/videos/<stem>.webm (hardlinked masters; not on Pages)
 * - Prod:  R2 CDN https://assets.e7codex.com/illust/<stem>.webm
 */
function lobbyAnimVariants(a) {
  if (a && Array.isArray(a.variants) && a.variants.length) return a.variants;
  return [{
    id: "default",
    label: "",
    video: a && a.video,
    bytes: a && a.bytes,
    duration_s: a && a.duration_s,
    default: true,
  }];
}
function lobbyAnimActiveVariant(a, varId) {
  const vars = lobbyAnimVariants(a);
  if (varId) {
    const hit = vars.find((v) => v.id === varId);
    if (hit) return hit;
  }
  return vars.find((v) => v.default) || vars[0];
}
/** File stem used for local hardlink / CDN object (epma_04, epma_04_story). */
function lobbyAnimVideoStem(a, variant) {
  const v = variant || lobbyAnimActiveVariant(a);
  const path = ((v && v.video) || (a && a.video) || "").replace(/^\//, "");
  const m = path.match(/([^/]+)\.webm$/i);
  if (m) return m[1];
  const base = (a && a.id) || "clip";
  if (v && v.id && v.id !== "default" && !v.default) return `${base}_${v.id}`;
  return base;
}
function lobbyAnimVideoUrl(a, variant) {
  const v = variant || lobbyAnimActiveVariant(a);
  const stem = lobbyAnimVideoStem(a, v);
  if (E7.isLocal) {
    return `assets/_illust/videos/${encodeURIComponent(stem)}.webm`;
  }
  const path = ((v && v.video) || (a && a.video) || `illust/${stem}.webm`).replace(/^\//, "");
  return `${E7.CDN || "https://assets.e7codex.com"}/${path}`;
}
function lobbyAnimPlayLabel(a, variant) {
  const v = variant || lobbyAnimActiveVariant(a);
  const bits = [E7.t("wp_anim_play", {}, "▶ Play")];
  const dur = formatDur(v.duration_s != null ? v.duration_s : a.duration_s);
  if (dur) bits.push(dur);
  bits.push(`~${formatMb(v.bytes != null ? v.bytes : a.bytes)} MB`);
  return bits.join(" · ");
}
function lobbyAnimVariantTabsHtml(a, selectedId) {
  const vars = lobbyAnimVariants(a);
  if (vars.length < 2) return "";
  const sel = selectedId || (lobbyAnimActiveVariant(a).id);
  return `<div class="wp-anim-variants" role="tablist" aria-label="${escapeHtml(E7.t("wp_anim_variants", {}, "Clip variant"))}">
    ${vars.map((v) => {

/** Slugs that identify a unit across variants for lobby_anims.units matching. */
function unitLobbyIdSet(u, group) {

function lobbyAnimsForUnit(u, group) {

/** e.g. 114 → "1:54", 20 → "0:20", 6.7 → "0:07" */
function formatDur(sec) {
  if (sec == null || !(sec > 0)) return null;
  const s = Math.round(sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}
function unitResolve(slug) {
  let u = (UNITS || []).find(x => x.id === slug || x.base === slug);
  if (!u && BY_BASE && BY_BASE.get) {
    const g = BY_BASE.get(slug);
    u = Array.isArray(g) ? g[0] : g;
  }
  const name = u ? displayName(u) : slug;
  const hrefSlug = (u && (u.base || u.id)) || slug;
  return { name, href: `#/u/${hrefSlug}` };
}
/** Newest `released` (YYYY-MM-DD) among linked units; empty → sort last. */
function lobbyAnimSortKey(a) {
  let best = "";
  for (const slug of a.units || []) {
    let u = (UNITS || []).find(x => x.id === slug || x.base_id === slug || x.base === slug);
    if (!u && BY_BASE && BY_BASE.get) {
      const g = BY_BASE.get(slug);
      if (Array.isArray(g) && g.length) {
        for (const m of g) {
          const d = m && m.released;
          if (d && d > best) best = d;
        }
        continue;
      }
      u = g;
    }
    const d = u && u.released;
    if (d && d > best) best = d;
  }
  return best;
}
function lobbyAnimsSorted(list) {
  // NEW packs first, then newest unit release; multi-link packs use max date.
  return (list || []).slice().sort((a, b) => {
    const na = a.new ? 0 : 1;
    const nb = b.new ? 0 : 1;
    if (na !== nb) return na - nb;
    const da = lobbyAnimSortKey(a);
    const db = lobbyAnimSortKey(b);
    if (da && db) return db.localeCompare(da);
    if (da) return -1;
    if (db) return 1;
    return (a.id || "").localeCompare(b.id || "");
  });
}
function lobbyAnimCardsHtml(list) {
  if (!list.length) {
    return `<p class="empty" style="margin:0">${E7.t("wp_anim_none", {}, "No animated lobby packs indexed yet.")}</p>`;
  }
  const ordered = lobbyAnimsSorted(list);
  return `<div class="wp-anim-grid">${ordered.map(a => {
    const def = lobbyAnimActiveVariant(a);
    const btnLab = lobbyAnimPlayLabel(a, def);
    const aria = a.title ? `${btnLab} — ${a.title}` : btnLab;
    const vars = lobbyAnimVariantTabsHtml(a, def.id);
    const newBadge = a.new
      ? `<span class="new-badge">${escapeHtml(E7.t("badge_new"))}</span>`
      : "";
    return `<article class="wp-anim-card" data-anim-id="${escapeHtml(a.id)}" data-anim-var="${escapeHtml(def.id || "")}">
      ${newBadge}
      <button type="button" class="wp-anim-poster" data-anim-play="${escapeHtml(a.id)}"
        data-anim-var="${escapeHtml(def.id || "")}"
        aria-label="${escapeHtml(aria)}">
        <img loading="lazy" src="${escapeHtml(a.poster)}" alt="" width="1280" height="720">
        <div class="wp-anim-play"><span>${escapeHtml(btnLab)}</span></div>
      </button>
      ${vars}
    </article>`;
  }).join("")}</div>`;
}

// Lobby horizontal cut + portrait full-art shown side-by-side in a grid.
// Card click → lightbox of the portrait; small "↗ cb" pill links to ceciliabot
// (deep link when the artifact has a slug, hub index otherwise). Rarity + role
// filter chips compose like the hub's element/rarity filters.
const ARTI_ROLES = ["warrior", "knight", "ranger", "mage", "soul-weaver", "thief"];
// ceciliabot stores some roles with quirky spelling; normalize for the chips:
const ARTI_ROLE_ALIAS = { "manauser": "soul-weaver", "theif": "thief", "assassin": "thief" };
function artiRoleOf(a) { return ARTI_ROLE_ALIAS[a.role] || a.role || ""; }
function artiRarityStars(r) { return r ? "★".repeat(r) : ""; }

function artifactCellsHtml(list) {
  return list.map(a => {
    const name = E7.artifactName(a) || a.id;
    const role = artiRoleOf(a);
    const roleCap = role ? E7.gameTerm("class", role) : "";
    const rarity = a.rarity ? `${a.rarity}★` : "";
    const meta = [rarity, roleCap].filter(Boolean).join(" · ");
    const cap = [name, meta].filter(Boolean).join(" · ");
    const cb = a.cecilia || "";
    const annVid = a.announce_video || "";
    const owners = a.owner_units || [];
    const owner = owners[0] || null;
    const ownerHref = owner ? (owner.href || `#/u/${encodeURIComponent(owner.base_id || owner.id)}`) : "";
    const ownerName = owner ? (owner.name || owner.base_id || owner.id) : "";
    // data-cb / data-arti / data-ann-video / data-owner-* → lightbox action bar.
    // Thumb pills: ↗ cb + owner unit (stopPropagation via .a-cb / .a-owner).
    return `
      <a class="artifact-cell${a.new ? ' is-new' : ''}${a.announced ? ' is-ann' : ''}${a.unreleased ? ' is-unrel' : ''}" href="${escapeHtml(a.art_full)}" data-zoom data-cap="${escapeHtml(cap)}" data-arti="1"${cb ? ` data-cb="${escapeHtml(cb)}"` : ""}${annVid ? ` data-ann-video="${escapeHtml(annVid)}"` : ""}${ownerHref ? ` data-owner-href="${escapeHtml(ownerHref)}" data-owner-name="${escapeHtml(ownerName)}"` : ""} target="_blank" rel="noopener">
        <img loading="lazy" src="${escapeHtml(a.art_full)}" alt="${escapeHtml(name)}">
        ${a.unreleased ? `<span class="unrel-badge" title="${escapeHtml(E7.t('badge_unrel_t'))}">${E7.t('badge_unrel')}</span>` : ""}
        ${a.announced ? `<span class="ann-badge" title="${escapeHtml(E7.t('badge_announced_t', {}, 'officially previewed — not in gacha yet'))}">${E7.t('badge_announced', {}, 'ANNOUNCED')}</span>` : ""}
        ${a.new && !a.announced ? `<span class="new-badge">${E7.t('badge_new')}</span>` : ""}
        ${ownerHref ? `<button class="a-owner" type="button" data-owner-href="${escapeHtml(ownerHref)}" title="${escapeHtml(E7.t('lb_owner_unit_t', {}, 'Open owner unit page'))}">${escapeHtml(ownerName)}</button>` : ""}
        <span class="a-name">${escapeHtml(name)}${meta ? `<span class="a-meta">${escapeHtml(meta)}</span>` : ""}</span>
        ${cb ? `<button class="a-cb" data-cb="${escapeHtml(cb)}" type="button" title="${escapeHtml(E7.t('arti_cb_t'))}">↗ cb</button>` : ""}
      </a>`;
  }).join("");
}

function artifacts(opts) {
  opts = opts || {};
  setNav("artifacts");
  if (!ARTIFACTS.length) {
    $("#app").innerHTML = `<p class="empty">${E7.t('empty_artifacts')}</p>`;
    return;
  }
  const live = document.getElementById("qArti");
  if (live && document.activeElement === live) artiSearchQ = live.value;
  const q = artiSearchQ.trim().toLowerCase();
  const list = ARTIFACTS.filter(a => {
    if (artiRarityF.size && !artiRarityF.has(a.rarity)) return false;
    if (artiRoleF.size  && !artiRoleF.has(artiRoleOf(a))) return false;
    if (!q) return true;
    return (a.name && a.name.toLowerCase().includes(q))
        || (E7.artifactName(a) || "").toLowerCase().includes(q)
        || a.id.toLowerCase().includes(q);
  });
  const rarities = [5, 4, 3, 2, 1];
  const rarityCounts = {};
  const roleCounts = {};
  for (const a of ARTIFACTS) {
    if (a.rarity) rarityCounts[a.rarity] = (rarityCounts[a.rarity]||0)+1;
    const role = artiRoleOf(a);
    if (role) roleCounts[role] = (roleCounts[role]||0)+1;
  }
  const roleList = ARTI_ROLES.filter(r => roleCounts[r]);
  const gridHtml = artifactCellsHtml(list);
  const countHtml = escapeHtml(E7.t('arti_count', {n: list.length, total: ARTIFACTS.length}));

  // Soft path: keep #qArti mounted (same mobile keystroke fix as hub).
  const gridEl = document.getElementById("artiGrid");
  const countEl = document.getElementById("artiCount");
  if (opts.soft && gridEl && countEl && live) {
    countEl.textContent = E7.t('arti_count', {n: list.length, total: ARTIFACTS.length});
    gridEl.innerHTML = gridHtml;
    return;
  }

  $("#app").innerHTML = `
    <div class="bar">
      <div class="q-wrap">
        <input id="qArti" placeholder="${escapeHtml(E7.t('arti_search_ph'))}"
               value="${escapeHtml(artiSearchQ)}" inputmode="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <p class="section-label first" id="artiCount">${countHtml}</p>
    <div class="kinds" id="artiRarity">
      ${rarities.filter(r => rarityCounts[r]).map(r => `
        <button data-r="${r}" class="${artiRarityF.has(r)?'on':''}">${artiRarityStars(r)}<span class="n">${rarityCounts[r]}</span></button>`).join("")}
    </div>
    <div class="kinds" id="artiRole">
      ${roleList.map(r => `
        <button data-role="${r}" class="${artiRoleF.has(r)?'on':''}">${escapeHtml(E7.gameTerm("class", r))}<span class="n">${roleCounts[r]}</span></button>`).join("")}
    </div>
    <div class="artifact-grid" id="artiGrid">${gridHtml}</div>`;

  document.querySelectorAll("#artiRarity button").forEach(b => b.onclick = () => {
    const r = +b.dataset.r;
    artiRarityF.has(r) ? artiRarityF.delete(r) : artiRarityF.add(r);
    artifacts();
  });
  document.querySelectorAll("#artiRole button").forEach(b => b.onclick = () => {
    const r = b.dataset.role;
    artiRoleF.has(r) ? artiRoleF.delete(r) : artiRoleF.add(r);
    artifacts();
  });
  const qEl = document.getElementById("qArti");
  // Debounced soft re-render — never destroy the focused input mid-type.
  if (qEl) qEl.oninput = (e) => {
    artiSearchQ = e.target.value;
    clearTimeout(window._qArtiDebounce);
    window._qArtiDebounce = setTimeout(() => artifacts({ soft: true }), 120);
  };
}

// ===== Story book (LOCAL ONLY) =====================================
// The full Main-Story screenplay: a chapter table-of-contents (#/story) and an
// illustrated reader (#/story/<chapterId>) with an EN/KR/JA dialogue toggle and
// a per-chapter "Voices" panel reusing the voice-clip machinery. All data is
// gitignored + held aside on deploy, so none of this ships publicly.
// Short labels for the dialogue-text languages (the data carries up to 10).
const STORY_TEXT_LABELS = { en:"EN", kr:"KR", ja:"JA", zht:"繁", zhs:"简",
  de:"DE", fr:"FR", es:"ES", pt:"PT", th:"TH" };
const STORY_VOICE_LANGS = [["en","EN"],["ja","JA"],["ko","KR"]];   // extracted voice langs

function injectStoryNav() {
  if (document.querySelector('nav button[data-v="story"]')) return;
  const nav = document.querySelector("header nav");
  if (!nav) return;
  const btn = document.createElement("button");
  btn.dataset.v = "story"; btn.textContent = "Story"; btn.setAttribute("data-i18n", "nav_story");
  btn.onclick = () => { location.hash = "#/story"; };
  const about = nav.querySelector('button[data-v="about"]');
  nav.insertBefore(btn, about);
}

function story() {
  setNav("story");
  const eps = (STORY_INDEX && STORY_INDEX.episodes) || [];
  if (!eps.length) { $("#app").innerHTML = `<p class="empty">No story indexed.</p>`; return; }
  const total = eps.reduce((n,e) => n + e.chapters.length, 0);
  $("#app").innerHTML = `
    <p class="section-label first">Main Story · ${total} chapters</p>
    <div class="story-toc">
      ${eps.map(e => `
        <section class="story-ep">
          <h2 class="story-ep-h">${escapeHtml(e.label)}</h2>
          <div class="story-chaps">
            ${e.chapters.map(c => `
              <a class="story-chap" href="#/story/${encodeURIComponent(c.id)}">
                ${c.bg ? `<span class="story-chap-bg" style="background-image:url('${c.bg}')"></span>`
                       : `<span class="story-chap-bg story-chap-bg-blank"></span>`}
                <span class="story-chap-meta">
                  <span class="story-chap-t">${escapeHtml(c.label)}</span>
                  <span class="story-chap-n">${c.beats} lines</span>
                </span>
              </a>`).join("")}
          </div>
        </section>`).join("")}
    </div>`;
}

function storyFlat() {
  const flat = [];
  for (const e of (STORY_INDEX && STORY_INDEX.episodes) || [])
    for (const c of e.chapters) flat.push({ ...c, ep: e.label });
  return flat;
}

async function storyChapter(cid) {
  setNav("story");
  const flat = storyFlat();
  const idx = flat.findIndex(c => c.id === cid);
  if (idx < 0) { $("#app").innerHTML = `<p class="empty">Chapter not found.</p>`; return; }
  $("#app").innerHTML = `<p class="empty">Loading…</p>`;
  let beats;
  try {
    beats = STORY_CHAPTERS[cid] ||
      (STORY_CHAPTERS[cid] = await (await fetch(`data/story/${encodeURIComponent(cid)}.json`)).json());
  } catch { $("#app").innerHTML = `<p class="empty">Chapter failed to load.</p>`; return; }
  renderStoryChapter(cid, flat[idx], flat, idx, beats);
}

// Resolve a story-voice clip URL for the selected voice language (with fallback).
function storyVoiceUrl(vkey) {
  const langs = (VOICE_STORY && VOICE_STORY[vkey]) || [];
  if (!langs.length) return null;
  const lang = langs.includes(storyVoiceLang) ? storyVoiceLang : langs[0];
  return `${VOICE_BASE}/story/${lang}/${vkey}.ogg`;
}
function playStoryVoice(vkey) {
  const url = storyVoiceUrl(vkey);
  if (!url) return;
  if (!storyAudio) storyAudio = new Audio();
  try { storyAudio.pause(); } catch {}
  storyAudio.src = url;
  storyAudio.play().catch(() => {});
}
const isVoiced = (b) => b.v && VOICE_STORY && VOICE_STORY[b.v];

function beatHtml(b, L, fi) {
  if (b.t === "scene") {
    return b.bg
      ? `<a class="scene-divider" data-zoom href="${b.bg}" data-cap="${escapeHtml(b.raw||'')}"><img src="${b.bg}" alt="" loading="lazy"></a>`
      : `<div class="scene-divider scene-blank">· · ·</div>`;
  }
  const txt = escapeHtml((b.text && (b.text[L] || b.text.en || b.text.kr)) || "");
  const vbtn = isVoiced(b) ? `<button class="beat-voice" data-v="${b.v}" title="play voice">▶</button>` : "";
  // "Play in Theater from here" — fi is this beat's frame index.
  const tbtn = fi != null ? `<button class="beat-fromhere" data-fi="${fi}" title="Play in Theater from here">⛶</button>` : "";
  if (b.t === "title") return `<div class="beat-title">${txt}${tbtn}</div>`;
  if (b.t === "narr")  return `<div class="beat-narr">${vbtn}${txt}${tbtn}</div>`;
  const port = b.portrait
    ? `<a class="beat-portrait" data-zoom href="${b.portrait}" data-cap="${escapeHtml(b.name||'')}"><img src="${b.portrait}" alt="" loading="lazy"></a>`
    : `<span class="beat-portrait beat-portrait-blank">${escapeHtml((b.name||'?').slice(0,1))}</span>`;
  const nm = b.slug
    ? `<a class="beat-name" href="#/u/${encodeURIComponent(b.slug)}">${escapeHtml(b.name)}</a>`
    : `<span class="beat-name">${escapeHtml(b.name)}</span>`;
  return `<div class="beat-line${b.choice?' beat-choice':''}">${port}
    <div class="beat-text"><div class="beat-spk">${nm}${vbtn}${tbtn}</div><div class="beat-say">${txt}</div></div></div>`;
}

// Render a chapter's beats to HTML, tagging each displayable beat with its theater
// frame index (frames skip `scene` beats, matching buildFrames()).
function storyBodyHtml(beats, L) {
  let fi = 0;
  return beats.map(b => b.t === "scene" ? beatHtml(b, L, null) : beatHtml(b, L, fi++)).join("");
}

// ----- Theater (visual-novel) mode -----
// Walks the chapter's beats into VN "frames" (each line/narr/title carries the
// latest scene background) and shows one at a time over a dimmed bg, with the
// text in a translucent box. Click / → / Space advance; ← back; Esc closes.
function buildFrames(beats) {
  // Seed with the chapter's first background so opening frames aren't a blank screen.
  let bg = (beats.find(b => b.t === "scene" && b.bg) || {}).bg || null;
  const fr = [];
  for (const b of beats) {
    if (b.t === "scene") { bg = b.bg || bg; continue; }
    fr.push({ bg, kind: b.t, name: b.name || null, portrait: b.portrait || null,
              text: b.text, v: b.v || null });
  }
  return fr;
}
function openTheater(frames, i) {
  if (!frames.length) return;
  THEATER = { frames, i: i || 0 };
  let el = document.getElementById("theater");
  if (!el) { el = document.createElement("div"); el.id = "theater"; el.className = "theater"; document.body.appendChild(el); }
  el.classList.add("open");
  el.onclick = (e) => { if (!e.target.closest(".th-close, .th-bar, .beat-voice")) theaterStep(1); };
  theaterRender();
}
function theaterRender() {
  if (!THEATER) return;
  const { frames, i } = THEATER, f = frames[i], L = storyLang;
  const txt = escapeHtml((f.text && (f.text[L] || f.text.en || f.text.kr)) || "");
  const voiced = f.v && VOICE_STORY && VOICE_STORY[f.v];
  const el = document.getElementById("theater");
  el.innerHTML = `
    <div class="th-bg" style="${f.bg ? `background-image:url('${f.bg}')` : ""}"></div>
    <div class="th-bar">
      <span class="th-prog">${i+1} / ${frames.length}</span>
      <button class="th-close" id="thClose" title="exit (Esc)">✕</button>
    </div>
    ${f.portrait ? `<img class="th-portrait" src="${f.portrait}" alt="">` : ""}
    <div class="th-box${f.kind!=='line'?' th-center':''}">
      ${f.name ? `<div class="th-name">${escapeHtml(f.name)}${voiced?` <button class="beat-voice th-replay" data-v="${f.v}" title="replay">▶</button>`:""}</div>` : ""}
      <div class="th-text">${txt}</div>
    </div>
    <div class="th-hint">click / → next · ← back · Esc exit</div>`;
  document.getElementById("thClose").onclick = (e) => { e.stopPropagation(); closeTheater(); };
  if (voiced) playStoryVoice(f.v);
}
function theaterStep(d) {
  if (!THEATER) return;
  const n = THEATER.i + d;
  if (n < 0) return;
  if (n >= THEATER.frames.length) { closeTheater(); return; }
  THEATER.i = n; theaterRender();
}
function closeTheater() {
  const el = document.getElementById("theater");
  if (el) el.classList.remove("open");
  if (storyAudio) { try { storyAudio.pause(); } catch {} }
  THEATER = null;
}

function renderStoryChapter(cid, meta, flat, idx, beats) {
  STORY_FRAMES = buildFrames(beats);
  const langs = (STORY_INDEX && STORY_INDEX.langs) || ["en", "kr", "ja"];
  if (!langs.includes(storyLang)) storyLang = langs[0];
  const textBtns = langs.map(k =>
    `<button class="slang${k===storyLang?' on':''}" data-lang="${k}">${STORY_TEXT_LABELS[k]||k.toUpperCase()}</button>`).join("");
  const voicedN = beats.filter(isVoiced).length;
  const voiceBtns = STORY_VOICE_LANGS.map(([k,lab]) =>
    `<button class="svlang${k===storyVoiceLang?' on':''}" data-lang="${k}">${lab}</button>`).join("");
  const prev = idx > 0 ? flat[idx-1] : null, next = idx < flat.length-1 ? flat[idx+1] : null;
  $("#app").innerHTML = `
    <div class="story-reader">
      <div class="story-rhead">
        <a class="story-back" href="#/story">← All chapters</a>
        <div class="story-title"><span class="story-ep-tag">${escapeHtml(meta.ep)}</span><h2>${escapeHtml(meta.label)}</h2></div>
        <button class="story-theater-btn" id="thStart">▶ Theater</button>
      </div>
      <div class="story-langbar">
        <span class="story-lang-grp"><span class="story-lang-lbl">Text</span><span class="slang-row">${textBtns}</span></span>
        ${voicedN ? `<span class="story-lang-grp"><span class="story-lang-lbl">Voice</span><span class="slang-row">${voiceBtns}</span></span>` : ""}
      </div>
      ${voicedN ? `<p class="story-voiced-note">${voicedN} voiced lines — ▶ plays the line · ⛶ starts Theater there</p>` : ""}
      <div class="story-body" id="storyBody">${storyBodyHtml(beats, storyLang)}</div>
      <div class="story-nav">
        ${prev ? `<a href="#/story/${encodeURIComponent(prev.id)}">← ${escapeHtml(prev.label)}</a>` : `<span></span>`}
        ${next ? `<a href="#/story/${encodeURIComponent(next.id)}">${escapeHtml(next.label)} →</a>` : `<span></span>`}
      </div>
    </div>`;
  window.scrollTo(0, 0);
  // Text language: re-render the body in the chosen language.
  document.querySelectorAll(".slang").forEach(btn => btn.onclick = () => {
    storyLang = btn.dataset.lang;
    document.querySelectorAll(".slang").forEach(b => b.classList.toggle("on", b === btn));
    document.getElementById("storyBody").innerHTML = storyBodyHtml(beats, storyLang);
  });
  // Voice language: independent of text (just re-style; next play uses it).
  document.querySelectorAll(".svlang").forEach(btn => btn.onclick = () => {
    storyVoiceLang = btn.dataset.lang;
    document.querySelectorAll(".svlang").forEach(b => b.classList.toggle("on", b === btn));
  });
  document.getElementById("thStart").onclick = () => openTheater(STORY_FRAMES, 0);
}

function route() {
  const h = location.hash;
  const isHub = !(h.startsWith("#/u/") || h.startsWith("#/story") || h.startsWith("#/updates") || h === "#/emotes" || h.startsWith("#/wallpapers") || h === "#/artifacts" || h === "#/about");
  // Release IntersectionObserver references to the previous hub render before
  // any view swaps in — otherwise the detached <img> nodes stay pinned.
  if (!isHub && _hubImgObs) { _hubImgObs.disconnect(); _hubImgObs = null; }
  if (h.startsWith("#/u/")) {
    const rest = decodeURIComponent(h.slice(4));
    const [base, vsuf] = rest.split("/");
    detail(base, vsuf || "");
  } else if (h.startsWith("#/story/")) storyChapter(decodeURIComponent(h.slice(8)));
  else   if (h === "#/story")       story();
  else   if (h === "#/updates" || h.startsWith("#/updates/")) updates();
  else   if (h === "#/emotes")     emotes();
  else   if (h === "#/wallpapers" || h.startsWith("#/wallpapers/")) wallpapers();
  else   if (h === "#/artifacts")  artifacts();
  else   if (h === "#/about")      about();
  else                              hub();
}

window.addEventListener("hashchange", route);
document.querySelectorAll("nav button").forEach(b =>
  b.onclick = () => {
    const v = b.dataset.v;
    location.hash = v === "hub" ? "#/" : "#/" + v;
  }
);

// Language switcher: a native <select> at the end of the header nav. Mirrors the
// nav-button wiring above. On change it persists + loads the overlay, fixes the
// out-of-#app chrome, and re-renders the current view (route() is pure). The
// select value is synced to the active language in applyStaticChrome().
(function wireLangSwitcher() {
  const nav = document.querySelector("header nav");
  if (!nav) return;
  nav.insertAdjacentHTML("beforeend", E7.langSelectHtml("langSel"));
  const sel = document.getElementById("langSel");
  sel.value = E7.getLang();
  sel.onchange = async () => {
    await E7.setLang(sel.value);
    // keep the language in the URL so it survives reloads + is shareable
    try {
      const url = new URL(location.href);
      url.searchParams.set("lang", sel.value);
      history.replaceState(null, "", url);
    } catch (e) {}
    applyStaticChrome();
    route();
  };
})();

// Global lightbox: any <a data-zoom href="..."> opens the asset full-size in
// the modal instead of navigating. We use delegation so it picks up links
// rendered after page-load (gallery, emotes, wallpapers, …) without needing
// per-route wiring. Right-click / middle-click still hit the link's href so
// "open in new tab" keeps working.
// Optional per-link actions (artifacts): data-cb → ceciliabot, data-arti →
// Artifacts tab — rendered as pills under the open image so Updates Featured
// (and the Artifacts grid) can still reach CB after zooming.
const LB        = document.getElementById("lightbox");
const LB_IMG    = document.getElementById("lbImage");
const LB_AUDIO  = document.getElementById("lbAudio");
const LB_VIDEO  = document.getElementById("lbVideo");
const LB_DL     = document.getElementById("lbDownload");
const LB_CAP    = document.getElementById("lbCaption");
const LB_ACT    = document.getElementById("lbActions");
function setLbActions(actions) {
  if (!LB_ACT) return;
  if (!actions || !actions.length) {
    LB_ACT.innerHTML = "";
    LB_ACT.hidden = true;
    LB.classList.remove("has-actions");
    return;
  }
  LB_ACT.hidden = false;
  LB.classList.add("has-actions");
  LB_ACT.innerHTML = actions.map(a => {
    const label = escapeHtml(a.label || "");
    const title = escapeHtml(a.title || a.label || "");
    const href = escapeHtml(a.href || "#");
    if (a.external) {
      return `<a class="lb-act" href="${href}" target="_blank" rel="noopener" title="${title}">${label}</a>`;
    }
    // In-site hash routes: close lightbox so the destination is usable.
    return `<a class="lb-act lb-act-local" href="${href}" title="${title}">${label}</a>`;
  }).join("");
}
function actionsFromZoomAnchor(a) {
  if (!a || !a.dataset) return [];
  const out = [];
  if (a.dataset.annVideo) {
    out.push({
      href: a.dataset.annVideo,
      label: E7.t("btn_announce_video", {}, "▶ official preview"),
      title: E7.t("btn_announce_video_t", {}, "official skill / hero preview"),
      external: true,
    });
  }
  if (a.dataset.cb) {
    out.push({
      href: a.dataset.cb,
      label: E7.t("lb_cb", {}, "↗ cb"),
      title: E7.t("arti_cb_t", {}, "open on ceciliabot"),
      external: true,
    });
  }
  // Signature owner unit (artifact → hero page). data-owner-href="#/u/c####"
  if (a.dataset.ownerHref) {
    const lab = a.dataset.ownerName || E7.t("lb_owner_unit", {}, "Unit");
    out.push({
      href: a.dataset.ownerHref,
      label: lab,
      title: E7.t("lb_owner_unit_t", {}, "Open owner unit page"),
      external: false,
    });
  }
  if (a.dataset.arti === "1" || a.dataset.arti === "true") {
    out.push({
      href: "#/artifacts",
      label: E7.t("nav_artifacts", {}, "Artifacts"),
      title: E7.t("lb_artifacts_t", {}, "Open the Artifacts tab"),
      external: false,
    });
  }
  return out;
}
function openLightbox(src, caption, actions) {
  LB.classList.remove("audio", "video");
  LB_AUDIO.pause(); LB_AUDIO.removeAttribute("src");
  LB_VIDEO.pause(); LB_VIDEO.removeAttribute("src");
  LB_IMG.style.display = "";
  LB_IMG.src = src;
  LB_DL.href = src;
  LB_DL.download = decodeURIComponent(src.split("/").pop() || "asset");
  LB_CAP.textContent = caption || "";
  setLbActions(actions || []);
  LB.classList.add("open");
  LB.setAttribute("aria-hidden", "false");
}
function openLightboxAudio(src, caption) {
  LB.classList.add("audio"); LB.classList.remove("video");
  LB_IMG.style.display = "none"; LB_IMG.src = "";
  LB_VIDEO.pause(); LB_VIDEO.removeAttribute("src");
  LB_AUDIO.src = src;
  LB_DL.href = src;
  LB_DL.download = decodeURIComponent(src.split("/").pop() || "clip") ;
  LB_CAP.textContent = caption || "";
  setLbActions([]);
  LB.classList.add("open");
  LB.setAttribute("aria-hidden", "false");
  LB_AUDIO.play().catch(() => {}); // autoplay; ignore if blocked
}
function openLightboxVideo(src, caption, actions) {
  LB.classList.add("video"); LB.classList.remove("audio");
  LB_IMG.style.display = "none"; LB_IMG.src = "";
  LB_AUDIO.pause(); LB_AUDIO.removeAttribute("src");
  LB_VIDEO.src = src;
  LB_DL.href = src;
  LB_DL.download = decodeURIComponent(src.split("/").pop() || "illustration");
  LB_CAP.textContent = caption || "";
  setLbActions(actions || []);
  LB.classList.add("open");
  LB.setAttribute("aria-hidden", "false");
  LB_VIDEO.play().catch(() => {}); // autoplay; ignore if blocked
}
function closeLightbox() {
  LB.classList.remove("open", "audio", "video", "has-actions");
  LB.setAttribute("aria-hidden", "true");
  LB_IMG.src = "";
  LB_AUDIO.pause(); LB_AUDIO.removeAttribute("src");
  LB_VIDEO.pause(); LB_VIDEO.removeAttribute("src");
  setLbActions([]);
}
document.addEventListener("click", (e) => {
  // Modifier-click / non-primary buttons preserve the native link behaviour.
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  // Artifact "↗ cb" pill (Artifacts grid + Updates Featured) — open CB without
  // triggering the parent data-zoom lightbox.
  const cbBtn = e.target.closest(".a-cb");
  if (cbBtn) {
    e.preventDefault();
    e.stopPropagation();
    const url = cbBtn.dataset.cb;
    if (url) window.open(url, "_blank", "noopener");
    return;
  }
  // Artifact owner-unit pill — go to unit page without opening the zoom.
  const ownBtn = e.target.closest(".a-owner");
  if (ownBtn) {
    e.preventDefault();
    e.stopPropagation();
    const href = ownBtn.dataset.ownerHref || "";
    // href is "#/u/<base>" — assign hash route (with leading #).
    if (href) location.hash = href.startsWith("#") ? href : ("#" + href);
    return;
  }
  // Inline story-voice play button (reader + theater replay).
  const bvBtn = e.target.closest(".beat-voice");
  if (bvBtn) { e.preventDefault(); e.stopPropagation(); playStoryVoice(bvBtn.dataset.v); return; }
  // "Play in Theater from here" button.
  const fhBtn = e.target.closest(".beat-fromhere");
  if (fhBtn) { e.preventDefault(); openTheater(STORY_FRAMES, +fhBtn.dataset.fi); return; }
  // Voice-line clip → audio lightbox.
  const clip = e.target.closest(".vlclip");
  if (clip) {
    const { slug, action, take, label } = clip.dataset;
    const url = `${VOICE_BASE}/${voiceLang}/voc_${slug}_${action}_${take}.ogg`;
    const langLab = (AUDIO_LANGS.find(([k]) => k === voiceLang) || ["", voiceLang])[1];
    openLightboxAudio(url, `${label}${+take > 1 ? " (" + take + ")" : ""} · ${langLab}`);
    return;
  }
  // Voice language toggle → re-render the clip rows for the chosen language.
  const lang = e.target.closest(".vlang");
  if (lang) {
    voiceLang = lang.dataset.lang;
    lang.parentElement.querySelectorAll(".vlang").forEach(b =>
      b.classList.toggle("on", b === lang));
    const box = document.getElementById("voiceClips");
    if (box) {
      const slug = box.dataset.clipslug;
      box.innerHTML = renderVoiceClips(slug, VOICE_CLIPS[slug], voiceLang);
    }
    return;
  }
  // FULL S3 badge on a skill card → open the baked full clip; the card's own
  // anchor keeps opening the short preview (button click must not bubble).
  const fb = e.target.closest(".full-badge");
  if (fb) { e.preventDefault(); e.stopPropagation(); openLightbox(fb.dataset.full, fb.dataset.cap || ""); return; }
  // Inline intimacy illustration video → enlarge in the video lightbox.
  const iv = e.target.closest(".intimacy-vid");
  if (iv) { e.preventDefault(); openLightboxVideo(iv.getAttribute("src"), iv.dataset.cap || ""); return; }
  // Intimacy reaction thumbnail → play the clip in the video lightbox.
  const ir = e.target.closest(".intim-react");
  if (ir) { e.preventDefault(); openLightboxVideo(ir.dataset.reactSrc, ir.dataset.cap || ""); return; }
  // Unit-page event wallpaper (lobby_anims link) → same open as Wallpapers → Animated.
  // Ignore clicks that originated on Idle/Story tabs (siblings of the play button).
  if (e.target.closest(".wp-anim-variants")) return;
  const lob = e.target.closest("[data-lobby-play]");
  if (lob) {
    e.preventDefault();
    const a = (LOBBY_ANIMS || []).find((x) => x.id === lob.dataset.lobbyPlay);
    if (!a) return;
    const card = lob.closest("[data-anim-id]");
    const varId = lob.dataset.animVar || (card && card.dataset.animVar) || "";
    openLobbyAnim(a, varId);
    return;
  }
  // Updates cinema clip (event movie) → video lightbox with sound allowed.
  const cin = e.target.closest("a[data-cinema]");
  if (cin) {
    e.preventDefault();
    openLightboxVideo(cin.getAttribute("href"), cin.dataset.cap || "");
    // Event cinematics are voiced — unmute after open (browser may still require a gesture; we are inside one).
    try { LB_VIDEO.muted = false; } catch (_) {}
    return;
  }
  const a = e.target.closest("a[data-zoom]");
  if (!a) return;
  e.preventDefault();
  openLightbox(a.getAttribute("href"), a.dataset.cap || "", actionsFromZoomAnchor(a));
});
LB.addEventListener("click", (e) => {
  // In-site action (e.g. Artifacts tab) — close so the destination is visible.
  const localAct = e.target.closest(".lb-act-local");
  if (localAct) {
    closeLightbox();
    // Let the hash link navigate; no preventDefault.
    return;
  }
  // External action (CB) — leave lightbox open; don't treat as backdrop close.
  if (e.target.closest(".lb-act") || e.target.closest(".lb-actions")) return;
  // Clicks on backdrop close; clicks on the image / audio / video / download / close don't.
  if (e.target === LB_IMG || e.target === LB_AUDIO || e.target === LB_VIDEO ||
      e.target.closest(".lb-download") || e.target.closest(".lb-audio") ||
      e.target.closest(".lb-video")) return;
  closeLightbox();
});
// Force a real download (not open-in-tab) for any lightbox asset. The native
// `download` attr is ignored cross-origin (e.g. audio/textures on R2), so fetch
// the bytes as a blob and save those. R2 CORS allows GET from the site origin;
// same-origin Pages assets (skill webp, pose, face art) need no CORS. Falls back
// to opening the URL if the fetch is blocked.
document.getElementById("lbDownload").addEventListener("click", async (e) => {
  const src = LB_DL.href;
  if (!src) return;
  e.preventDefault();
  const name = LB_DL.getAttribute("download") || "download";
  try {
    const resp = await fetch(src);
    if (!resp.ok) throw new Error(resp.status);
    const url = URL.createObjectURL(await resp.blob());
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (_) {
    window.open(src, "_blank", "noopener");
  }
});
document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && LB.classList.contains("open")) closeLightbox();
});
// Theater (VN) mode keyboard nav.
document.addEventListener("keydown", (e) => {
  if (!THEATER) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); theaterStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); theaterStep(-1); }
  else if (e.key === "Escape") { e.preventDefault(); closeTheater(); }
});

load();
</script>
